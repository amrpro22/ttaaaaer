
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>لوحة تسجيل المصروفات</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body{
            background:#f0f2f5;
            padding:20px;
            color: #1e293b;
            overflow-x: hidden;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        .card{
            background:#fff;
            border-radius:18px;
            padding:25px;
            box-shadow:0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .title{
            color:#1e3a8a;
            font-size:28px;
            font-weight:bold;
            margin-bottom: 5px;
        }

        .sync-info {
            color: #64748b;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .sync-icon {
            width: 12px;
            height: 12px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px;
        }

        .full{
            grid-column:1 / -1;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#475569;
            font-weight:600;
            font-size:14px;
        }

        input, select, textarea{
            width:100%;
            padding:12px;
            border:1px solid #cbd5e1;
            border-radius:10px;
            outline:none;
            font-size:16px; 
            transition:0.3s;
            background:#f8fafc;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus, select:focus, textarea:focus{
            border-color:#2563eb;
            background:#fff;
            box-shadow:0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        textarea{
            resize:none;
            min-height:100px;
        }

        .amount-box{
            display:flex;
            gap:10px;
        }

        .amount-box input{
            flex:1;
        }

        .amount-box select{
            width:140px;
        }

        .btn{
            width:100%;
            margin-top:20px;
            border:none;
            background:#2563eb;
            color:white;
            padding:16px;
            border-radius:12px;
            font-size:17px;
            cursor:pointer;
            font-weight:bold;
            transition:0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .btn:hover:not(:disabled){
            background:#1d4ed8;
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled){
            transform: translateY(0);
        }

        .credits {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
            line-height: 1.8;
        }

        .credits span { display: block; }
        .credits b { color: #1e3a8a; }

        .history-card {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .history-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1e3a8a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .expense-item {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            background: #ffffff;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .item-beneficiary { font-weight: bold; color: #1e293b; }
        .item-amount { color: #059669; font-weight: 800; }
        .item-details { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        
        .item-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px dashed #e2e8f0;
            padding-top: 10px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-medical { background: #fee2e2; color: #dc2626; }
        .badge-financial { background: #dcfce7; color: #166534; }
        .badge-other { background: #f1f5f9; color: #475569; }

        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media(max-width:700px){
            .grid{ grid-template-columns:1fr; }
            .amount-box{ flex-direction:column; }
            .amount-box select{ width:100%; }
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
</div>

<div class="container">
    <div class="card">
        <div class="header-section">
            <div class="title">لوحة تسجيل المصروفات</div>
            <div class="sync-info">
                <span class="sync-icon" id="statusIcon"></span>
                <span id="statusText">تتم مزامنة البيانات مع لوحة التحكم الرئيسية</span>
            </div>
        </div>

        <form id="expenseForm">
            <div class="grid">
                <div>
                    <label>اسم المستفيد</label>
                    <input type="text" id="beneficiaryName" placeholder="اكتب اسم المستفيد" required>
                </div>

                <div>
                    <label>نوع الحالة</label>
                    <select id="caseType" required>
                        <option value="">اختر نوع الحالة</option>
                        <option value="حالة مرضية">حالة مرضية</option>
                        <option value="حالة وفاة">حالة وفاة</option>
                        <option value="مساعدة مالية">مساعدة مالية</option>
                        <option value="حادث">حادث</option>
                        <option value="حالة إنسانية">حالة إنسانية</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>

                <div class="full">
                    <label>تفاصيل الحالة</label>
                    <textarea id="caseDetails" placeholder="اكتب تفاصيل الحالة بشكل كامل..." spellcheck="false"></textarea>
                </div>

                <div>
                    <label>المبلغ المنفق</label>
                    <div class="amount-box">
                        <input type="number" id="amount" placeholder="المبلغ" required>
                        <select id="currency">
                            <option value="ريال يمني">ريال يمني</option>
                            <option value="ريال سعودي">ريال سعودي</option>
                            <option value="دولار">دولار</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label>تاريخ التوثيق</label>
                    <input type="date" id="date" required>
                </div>

                <div class="full">
                    <label>تم الإدخال بواسطة <span style="color:red">*</span></label>
                    <input type="text" id="addedBy" placeholder="اسم مدخل البيانات" required>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span>حفظ في السحابة</span>
            </button>

            <div class="credits">
                <span>إشراف : <b>مصطفى الشجاع</b></span>
                <span>تطوير فني : <b>عمرو مسعد الشجاع</b></span>
            </div>
        </form>
    </div>

    <div class="history-card">
        <div class="history-title">
            <span>السجلات السابقة</span>
            <span id="recordCount" style="font-size: 14px; background: #e2e8f0; padding: 2px 10px; border-radius: 10px;">0 سجل</span>
        </div>
        <div id="expenseList" class="expense-list">
            <p style="text-align: center; color: #94a3b8; padding: 20px;">جاري الاتصال بقاعدة البيانات...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // إعدادات مشروعك magdi-50c75
    const firebaseConfig = {
      apiKey: "AIzaSyBzX7_q2Abx0pL9L5aMvzJ6I3hDdc8bXy8",
      authDomain: "magdi-50c75.firebaseapp.com",
      projectId: "magdi-50c75",
      storageBucket: "magdi-50c75.firebasestorage.app",
      messagingSenderId: "329518389376",
      appId: "1:329518389376:web:f2f73f4a257dcb84efee65",
      measurementId: "G-E3TK0NJ1PJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // يجب أن يطابق هذا الاسم تماماً ما تم وضعه في Rules (القواعد) في Firebase
    const appId = "magdi-expense-app";

    let currentUser = null;

    // تسجيل الدخول مجهول الهوية
    const login = async () => {
        try {
            await signInAnonymously(auth);
        } catch (error) {
            console.error("Auth Error:", error);
            document.getElementById("statusText").innerText = "خطأ في الاتصال بالسحابة";
            document.getElementById("statusIcon").style.background = "red";
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById("statusText").innerText = "متصل بالسحابة وآمن";
            document.getElementById("statusIcon").style.background = "#22c55e";
            loadExpenses();
        }
    });

    login();

    // استماع مباشر للبيانات
    function loadExpenses() {
        const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
        onSnapshot(expensesRef, (snapshot) => {
            const listContainer = document.getElementById("expenseList");
            const countBadge = document.getElementById("recordCount");
            listContainer.innerHTML = "";
            const docs = [];
            
            snapshot.forEach(doc => docs.push({id: doc.id, ...doc.data()}));
            docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            if (docs.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">لا توجد سجلات مخزنة حالياً.</p>';
                countBadge.innerText = "0 سجل";
                return;
            }

            countBadge.innerText = `${docs.length} سجل`;
            docs.forEach(data => {
                const item = document.createElement("div");
                item.className = "expense-item";
                let badgeClass = "badge-other";
                if(data.caseType?.includes("مرض")) badgeClass = "badge-medical";
                if(data.caseType?.includes("مالي")) badgeClass = "badge-financial";

                item.innerHTML = `
                    <div class="item-header">
                        <span class="item-beneficiary">${data.beneficiaryName}</span>
                        <span class="item-amount">${data.amount} ${data.currency}</span>
                    </div>
                    <div class="item-details">
                        <span class="badge ${badgeClass}">${data.caseType}</span>
                        <p style="margin-top:8px">${data.caseDetails || 'لا توجد تفاصيل إضافية'}</p>
                    </div>
                    <div class="item-footer">
                        <span>التاريخ: ${data.date}</span>
                        <span>بواسطة: ${data.addedBy}</span>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }, (error) => {
            console.error("Firestore error:", error);
            document.getElementById("expenseList").innerHTML = `<p style="text-align: center; color: red; padding: 20px;">حدث خطأ في جلب البيانات: تأكد من تفعيل Firestore والقواعد.</p>`;
        });
    }

    // إرسال البيانات
    const form = document.getElementById("expenseForm");
    const loadingOverlay = document.getElementById("loadingOverlay");

    form.addEventListener("submit", async function(e){
        e.preventDefault();
        if (!currentUser) {
            alert("يرجى الانتظار حتى يتم الاتصال بالسحابة...");
            return;
        }

        loadingOverlay.style.display = "flex";
        
        const data = {
            beneficiaryName: document.getElementById("beneficiaryName").value,
            caseType: document.getElementById("caseType").value,
            caseDetails: document.getElementById("caseDetails").value,
            amount: document.getElementById("amount").value,
            currency: document.getElementById("currency").value,
            date: document.getElementById("date").value,
            addedBy: document.getElementById("addedBy").value,
            createdAt: serverTimestamp(),
            userId: currentUser.uid
        };

        try {
            const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
            await addDoc(expensesRef, data);
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
        } catch (error) {
            console.error("Save error:", error);
            alert("خطأ: تأكد من ضبط الـ Rules كما طلبنا منك سابقاً.");
        } finally {
            loadingOverlay.style.display = "none";
        }
    });

    window.onload = () => {
        document.getElementById('date').valueAsDate = new Date();
    };
</script>
</body>
</html>
