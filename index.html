<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صندوق الحالات الطارئة - شامل الزكاة والمصروفات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Version 9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y;
            overflow-x: hidden;
        }

        .header-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .app-container {
            max-width: 480px; 
            margin: 0 auto;
            min-height: 100vh;
            background: #f8fafc;
            position: relative;
        }

        .currency-card-sar { border-top: 4px solid #10b981; background: #ecfdf5; }
        .currency-card-usd { border-top: 4px solid #3b82f6; background: #eff6ff; }
        .currency-card-yer { border-top: 4px solid #f59e0b; background: #fffbeb; }
        .currency-card-zakat { border-top: 4px solid #8b5cf6; background: #f5f3ff; }
        .currency-card-expense { border-top: 4px solid #ef4444; background: #fef2f2; }
        .currency-card-balance { border-top: 4px solid #06b6d4; background: #ecfeff; }

        .timeline-track {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .timeline-fill {
            height: 100%;
            transition: width 0.5s ease-in-out;
        }

        .filter-active {
            background-color: #0f172a !important;
            color: white !important;
        }

        .update-time-badge {
            font-size: 9px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .tab-active {
            background-color: #0f172a;
            color: white;
            border-radius: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .tab-inactive {
            background-color: transparent;
            color: #475569;
        }

        .payment-option-active {
            background-color: #0f172a !important;
            color: white !important;
            border-color: #0f172a !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBupAOs6diz9ET8lGnMdyKjS_cMS8sA2Uc",
            authDomain: "amr4admin.firebaseapp.com",
            projectId: "amr4admin",
            storageBucket: "amr4admin.firebasestorage.app",
            messagingSenderId: "177280788092",
            appId: "1:177280788092:web:44f16c8f585a5b3e484bf9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_PATH = "amr4admin";

        const App = () => {
            const [allRecords, setAllRecords] = useState([]); 
            const [expenses, setExpenses] = useState([]);
            const [beneficiaries, setBeneficiaries] = useState([]);
            const [user, setUser] = useState(null);
            const [filter, setFilter] = useState('all'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editId, setEditId] = useState(null);
            const [isPdfLoading, setIsPdfLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [geoInfo, setGeoInfo] = useState({ ip: '...', location: 'تحديد الموقع...' });
            
            const [activeTab, setActiveTab] = useState('emergency');
            
            const [zakatForm, setZakatForm] = useState({ 
                name: '', 
                amount: '', 
                currency: 'yer', 
                recordedBy: 'مصطفى الشجاع'
            });
            const [editZakatId, setEditZakatId] = useState(null);
            const [isZakatModalOpen, setIsZakatModalOpen] = useState(false);

            // Expenses state - تم اصلاح هيكل البيانات
            const [expenseForm, setExpenseForm] = useState({
                beneficiaryName: '',
                caseType: 'علاج',
                amount: '',
                currency: 'yer',
                expenseDate: new Date().toISOString().split('T')[0],
                recordedBy: 'مصطفى الشجاع',
                notes: ''
            });
            const [editExpenseId, setEditExpenseId] = useState(null);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);

            // Beneficiary state - تم اصلاح هيكل البيانات
            const [beneficiaryForm, setBeneficiaryForm] = useState({
                name: '',
                helpType: 'علاج',
                amount: '',
                currency: 'yer',
                helpDate: new Date().toISOString().split('T')[0],
                status: 'مكتمل',
                notes: '',
                recordedBy: 'مصطفى الشجاع'
            });
            const [editBeneficiaryId, setEditBeneficiaryId] = useState(null);
            const [isBeneficiaryModalOpen, setIsBeneficiaryModalOpen] = useState(false);

            // خيارات الدفع الجديدة لقسم الطوارئ
            const [paymentOption, setPaymentOption] = useState('none');
            const paymentOptions = [
                { value: 'none', label: 'بدون أقساط', months: 0 },
                { value: '3months', label: '3 أشهر', months: 3 },
                { value: '6months', label: '6 أشهر', months: 6 },
                { value: '1year', label: 'سنة كاملة', months: 12 }
            ];

            const fetchGeoData = async () => {
                const providers = [
                    { url: 'https://ipapi.co/json/', map: (d) => ({ ip: d.ip, location: d.country_name }) },
                    { url: 'https://worldtimeapi.org/api/ip', map: (d) => ({ ip: d.client_ip, location: d.timezone.split('/')[0] }) },
                    { url: 'https://ipinfo.io/json?token=7656641957242c', map: (d) => ({ ip: d.ip, location: d.country }) },
                    { url: 'https://api.db-ip.com/v2/free/self', map: (d) => ({ ip: d.ipAddress, location: d.countryName }) }
                ];

                for (const provider of providers) {
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), 2500);
                        const response = await fetch(provider.url, { signal: controller.signal });
                        clearTimeout(id);
                        if (response.ok) {
                            const data = await response.json();
                            const mapped = provider.map(data);
                            if (mapped.location && mapped.location !== 'undefined' && mapped.location !== 'Unknown') {
                                setGeoInfo(mapped);
                                return;
                            }
                        }
                    } catch (e) {
                        console.warn("Provider failed, switching...");
                    }
                }

                try {
                    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    let inferredLocation = "منطقة " + tz.split('/')[0];
                    if (tz.includes("Riyadh") || tz.includes("Asia/Aden")) inferredLocation = "السعودية/اليمن";
                    setGeoInfo({ ip: 'متصل', location: inferredLocation });
                } catch(e) {
                    setGeoInfo({ ip: 'مجهول', location: 'خارج التغطية' });
                }
            };

            useEffect(() => {
                fetchGeoData();
            }, []);

            const [form, setForm] = useState({ 
                name: '', 
                recordedBy: 'مصطفى الشجاع',
                totalAmount: '', 
                paidAmount: '', 
                currency: 'sar', 
                duration: 'none', 
                isPaidStatus: false 
            });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    if (!u) auth.signInAnonymously();
                    setUser(u);
                });
                return unsub;
            }, []);

            // Firestore listeners
            useEffect(() => {
                if (!user) return;
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                return ref.onSnapshot(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setAllRecords(data);
                }, err => console.error("Firestore Error:", err));
            }, [user]);

            useEffect(() => {
                if (!user) return;
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('expenses');
                return ref.onSnapshot(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setExpenses(data);
                }, err => console.error("Expenses Error:", err));
            }, [user]);

            useEffect(() => {
                if (!user) return;
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('beneficiaries');
                return ref.onSnapshot(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setBeneficiaries(data);
                }, err => console.error("Beneficiaries Error:", err));
            }, [user]);

            const donors = useMemo(() => {
                return allRecords.filter(record => !record.type || record.type !== 'zakat');
            }, [allRecords]);

            const zakatRecords = useMemo(() => {
                return allRecords.filter(record => record.type === 'zakat');
            }, [allRecords]);

            const parseInfo = (d) => {
                const note = d.note || "";
                const total = parseFloat((note.match(/T:(\d+(\.\d+)?)/) || [0, 0])[1]);
                const paid = parseFloat((note.match(/P:(\d+(\.\d+)?)/) || [0, 0])[1]);
                const duration = (note.match(/D:([a-z0-9]+)/) || [0, 'none'])[1];
                let curr = 'sar';
                if (note.includes('C:USD')) curr = 'usd';
                else if (note.includes('C:YER')) curr = 'yer';
                
                const progress = total > 0 ? Math.min(100, (paid / total) * 100) : 0;
                let color = "bg-rose-500";
                if (progress >= 100) color = "bg-emerald-500";
                else if (progress > 50) color = "bg-blue-500";
                else if (progress > 0) color = "bg-amber-500";

                return { total, paid, remaining: Math.max(0, total - paid), curr, progress, color, duration };
            };

            const totals = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                donors.forEach(d => {
                    const info = parseInfo(d);
                    if (sums[info.curr] !== undefined) sums[info.curr] += info.paid;
                });
                return sums;
            }, [donors]);

            const zakatTotals = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                zakatRecords.forEach(record => {
                    let curr = record.currency || 'yer';
                    let amount = parseFloat(record.amount) || 0;
                    if (sums[curr] !== undefined) sums[curr] += amount;
                });
                return sums;
            }, [zakatRecords]);

            const expenseTotals = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                expenses.forEach(exp => {
                    let curr = exp.currency || 'yer';
                    let amount = parseFloat(exp.amount) || 0;
                    if (sums[curr] !== undefined) sums[curr] += amount;
                });
                return sums;
            }, [expenses]);

            // حساب الرصيد المتبقي (التبرعات + الزكاة - المصروفات)
            const balance = useMemo(() => {
                return {
                    sar: (totals.sar + zakatTotals.sar) - expenseTotals.sar,
                    usd: (totals.usd + zakatTotals.usd) - expenseTotals.usd,
                    yer: (totals.yer + zakatTotals.yer) - expenseTotals.yer
                };
            }, [totals, zakatTotals, expenseTotals]);

            const filteredEmergencyList = useMemo(() => {
                let list = [...donors].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                if (searchTerm) list = list.filter(d => d.name.includes(searchTerm));
                return list.filter(d => {
                    const info = parseInfo(d);
                    if (filter === 'paid') return info.progress >= 100;
                    if (filter === 'partial') return info.progress > 0 && info.progress < 100;
                    if (filter === 'unpaid') return info.progress === 0;
                    return true;
                });
            }, [donors, filter, searchTerm]);

            const filteredZakatList = useMemo(() => {
                let list = [...zakatRecords].sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
                if (searchTerm) list = list.filter(z => z.name.includes(searchTerm));
                return list;
            }, [zakatRecords, searchTerm]);

            const filteredExpensesList = useMemo(() => {
                let list = [...expenses].sort((a, b) => (b.expenseDate || 0) - (a.expenseDate || 0));
                if (searchTerm) list = list.filter(e => e.beneficiaryName && e.beneficiaryName.includes(searchTerm));
                return list;
            }, [expenses, searchTerm]);

            const filteredBeneficiariesList = useMemo(() => {
                let list = [...beneficiaries].sort((a, b) => (b.helpDate || 0) - (a.helpDate || 0));
                if (searchTerm) list = list.filter(b => b.name && b.name.includes(searchTerm));
                return list;
            }, [beneficiaries, searchTerm]);

            // اصلاح دالة حفظ بيانات الطوارئ
            const handleSave = async (e) => {
                e.preventDefault();
                
                // التحقق من صحة البيانات
                if (!form.name || !form.totalAmount) {
                    alert('الرجاء إدخال الاسم والمبلغ الكلي');
                    return;
                }

                const now = Date.now();
                const note = `T:${form.totalAmount}|P:${form.paidAmount || 0}|C:${form.currency.toUpperCase()}|D:${paymentOption}`;
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                
                const data = { 
                    name: form.name, 
                    recordedBy: form.recordedBy,
                    ip: geoInfo.ip,
                    location: geoInfo.location,
                    note: note, 
                    updatedAt: now,
                    paymentPlan: paymentOption,
                    totalAmount: parseFloat(form.totalAmount),
                    paidAmount: parseFloat(form.paidAmount) || 0
                };

                try {
                    if (editId) {
                        await ref.doc(editId).update(data);
                        alert('تم تحديث البيانات بنجاح');
                    } else {
                        await ref.add({ ...data, createdAt: now });
                        alert('تم إضافة المشترك بنجاح');
                    }
                    closeModal();
                } catch (error) {
                    console.error("Firestore Save Error:", error);
                    alert('حدث خطأ في حفظ البيانات: ' + error.message);
                }
            };

            // اصلاح دالة حفظ الزكاة
            const handleSaveZakat = async (e) => {
                e.preventDefault();
                
                if (!zakatForm.name || !zakatForm.amount) {
                    alert('الرجاء إدخال الاسم والمبلغ');
                    return;
                }

                const now = Date.now();
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                
                const data = {
                    name: zakatForm.name,
                    amount: parseFloat(zakatForm.amount),
                    currency: zakatForm.currency,
                    recordedBy: zakatForm.recordedBy,
                    ip: geoInfo.ip,
                    location: geoInfo.location,
                    updatedAt: now,
                    type: 'zakat'
                };
                
                try {
                    if (editZakatId) {
                        await ref.doc(editZakatId).update(data);
                        alert('تم تحديث الزكاة بنجاح');
                    } else {
                        await ref.add({ ...data, createdAt: now });
                        alert('تم إضافة الزكاة بنجاح');
                    }
                    closeZakatModal();
                } catch (error) {
                    console.error("Zakat Save Error:", error);
                    alert('حدث خطأ في حفظ الزكاة: ' + error.message);
                }
            };

            // اصلاح دالة حفظ المصروفات - الحل الجذري
            const handleSaveExpense = async (e) => {
                e.preventDefault();
                
                // التحقق من صحة البيانات
                if (!expenseForm.beneficiaryName) {
                    alert('الرجاء إدخال اسم المستفيد');
                    return;
                }
                if (!expenseForm.amount || parseFloat(expenseForm.amount) <= 0) {
                    alert('الرجاء إدخال مبلغ صحيح');
                    return;
                }

                const now = Date.now();
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('expenses');
                
                // تحويل تاريخ الميلادي إلى timestamp
                let expenseTimestamp = now;
                if (expenseForm.expenseDate) {
                    expenseTimestamp = new Date(expenseForm.expenseDate).getTime();
                }
                
                const data = {
                    beneficiaryName: expenseForm.beneficiaryName.trim(),
                    caseType: expenseForm.caseType,
                    amount: parseFloat(expenseForm.amount),
                    currency: expenseForm.currency,
                    expenseDate: expenseTimestamp,
                    recordedBy: expenseForm.recordedBy,
                    notes: expenseForm.notes || '',
                    ip: geoInfo.ip,
                    location: geoInfo.location,
                    updatedAt: now
                };
                
                try {
                    if (editExpenseId) {
                        await ref.doc(editExpenseId).update(data);
                        alert('تم تحديث المصروف بنجاح');
                    } else {
                        await ref.add({ ...data, createdAt: now });
                        alert('تم تسجيل المصروف بنجاح');
                    }
                    closeExpenseModal();
                } catch (error) {
                    console.error("Expense Save Error:", error);
                    alert('حدث خطأ في حفظ المصروف: ' + error.message);
                }
            };

            // اصلاح دالة حفظ المستفيدين - الحل الجذري
            const handleSaveBeneficiary = async (e) => {
                e.preventDefault();
                
                // التحقق من صحة البيانات
                if (!beneficiaryForm.name) {
                    alert('الرجاء إدخال اسم المستفيد');
                    return;
                }
                if (!beneficiaryForm.amount || parseFloat(beneficiaryForm.amount) <= 0) {
                    alert('الرجاء إدخال مبلغ صحيح');
                    return;
                }

                const now = Date.now();
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('beneficiaries');
                
                // تحويل تاريخ الميلادي إلى timestamp
                let helpTimestamp = now;
                if (beneficiaryForm.helpDate) {
                    helpTimestamp = new Date(beneficiaryForm.helpDate).getTime();
                }
                
                const data = {
                    name: beneficiaryForm.name.trim(),
                    helpType: beneficiaryForm.helpType,
                    amount: parseFloat(beneficiaryForm.amount),
                    currency: beneficiaryForm.currency,
                    helpDate: helpTimestamp,
                    status: beneficiaryForm.status,
                    notes: beneficiaryForm.notes || '',
                    recordedBy: beneficiaryForm.recordedBy,
                    ip: geoInfo.ip,
                    location: geoInfo.location,
                    updatedAt: now
                };
                
                try {
                    if (editBeneficiaryId) {
                        await ref.doc(editBeneficiaryId).update(data);
                        alert('تم تحديث بيانات المستفيد بنجاح');
                    } else {
                        await ref.add({ ...data, createdAt: now });
                        alert('تم إضافة المستفيد بنجاح');
                    }
                    closeBeneficiaryModal();
                } catch (error) {
                    console.error("Beneficiary Save Error:", error);
                    alert('حدث خطأ في حفظ المستفيد: ' + error.message);
                }
            };
            
            const deleteZakatRecord = async (id) => {
                if (confirm("هل تريد حذف سجل الزكاة نهائياً؟")) {
                    const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                    await ref.doc(id).delete();
                    alert('تم الحذف بنجاح');
                }
            };
            
            const deleteEmergencyRecord = async (id) => {
                if (confirm("هل تريد حذف هذا السجل نهائياً؟")) {
                    const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                    await ref.doc(id).delete();
                    alert('تم الحذف بنجاح');
                }
            };

            const deleteExpenseRecord = async (id) => {
                if (confirm("هل تريد حذف هذا المصروف نهائياً؟")) {
                    const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('expenses');
                    await ref.doc(id).delete();
                    alert('تم الحذف بنجاح');
                }
            };

            const deleteBeneficiaryRecord = async (id) => {
                if (confirm("هل تريد حذف سجل المستفيد نهائياً؟")) {
                    const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('beneficiaries');
                    await ref.doc(id).delete();
                    alert('تم الحذف بنجاح');
                }
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditId(null);
                setForm({ name: '', recordedBy: 'مصطفى الشجاع', totalAmount: '', paidAmount: '', currency: 'sar', duration: 'none', isPaidStatus: false });
                setPaymentOption('none');
            };

            const closeZakatModal = () => {
                setIsZakatModalOpen(false);
                setEditZakatId(null);
                setZakatForm({ name: '', amount: '', currency: 'yer', recordedBy: 'مصطفى الشجاع' });
            };

            const closeExpenseModal = () => {
                setIsExpenseModalOpen(false);
                setEditExpenseId(null);
                setExpenseForm({ 
                    beneficiaryName: '', 
                    caseType: 'علاج', 
                    amount: '', 
                    currency: 'yer', 
                    expenseDate: new Date().toISOString().split('T')[0], 
                    recordedBy: 'مصطفى الشجاع', 
                    notes: '' 
                });
            };

            const closeBeneficiaryModal = () => {
                setIsBeneficiaryModalOpen(false);
                setEditBeneficiaryId(null);
                setBeneficiaryForm({ 
                    name: '', 
                    helpType: 'علاج', 
                    amount: '', 
                    currency: 'yer', 
                    helpDate: new Date().toISOString().split('T')[0], 
                    status: 'مكتمل', 
                    notes: '', 
                    recordedBy: 'مصطفى الشجاع' 
                });
            };

            const formatUpdateDate = (ts) => {
                if (!ts) return "غير متوفر";
                return new Date(ts).toLocaleDateString('ar-YE', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            };

            const getPaymentPlanLabel = (plan) => {
                const option = paymentOptions.find(opt => opt.value === plan);
                return option ? option.label : 'بدون أقساط';
            };

            const generatePDF = async () => {
                if (isPdfLoading) return;
                setIsPdfLoading(true);
                try {
                    const pdfElement = document.createElement('div');
                    pdfElement.style.position = 'fixed';
                    pdfElement.style.left = '-9999px';
                    pdfElement.style.top = '0';
                    pdfElement.style.width = '800px';
                    pdfElement.style.background = 'white';
                    pdfElement.style.direction = 'rtl';

                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4" onClick={closeModal}>
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={closeModal}></div>
                            <div className="relative bg-white w-full max-w-md rounded-[3rem] p-8 overflow-y-auto max-h-[90vh] shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black">{editId ? 'تعديل' : 'إضافة مشترك'}</h2><button onClick={closeModal} className="p-3 bg-slate-100 rounded-full text-xl font-bold">×</button></div>
                                <form onSubmit={handleSave} className="space-y-6">
                                    <input required placeholder="الاسم الكامل" className="w-full bg-slate-50 p-5 rounded-2xl text-right" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} />
                                    <select className="w-full bg-slate-100 p-4 rounded-2xl" value={form.recordedBy} onChange={e=>setForm({...form, recordedBy:e.target.value})}>
                                        <option>مصطفى الشجاع</option><option>ياسر الشجاع</option><option>عمرو الشجاع</option>
                                    </select>
                                    
                                    {/* خيارات الدفع الجديدة */}
                                    <div className="space-y-3">
                                        <label className="text-sm font-bold text-slate-700">خطة الدفع / التقسيط</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {paymentOptions.map(option => (
                                                <button
                                                    key={option.value}
                                                    type="button"
                                                    onClick={() => setPaymentOption(option.value)}
                                                    className={`px-4 py-3 rounded-xl text-sm font-bold transition-all border-2 ${
                                                        paymentOption === option.value 
                                                            ? 'payment-option-active border-slate-900 bg-slate-900 text-white' 
                                                            : 'border-slate-200 bg-slate-50 text-slate-600 hover:border-slate-300'
                                                    }`}
                                                >
                                                    {option.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="number" required placeholder="المبلغ الكلي" className="bg-slate-50 p-5 rounded-2xl" value={form.totalAmount} onChange={e=>setForm({...form, totalAmount:e.target.value})} />
                                        <select className="bg-slate-50 p-5 rounded-2xl" value={form.currency} onChange={e=>setForm({...form, currency:e.target.value})}>
                                            <option value="sar">ريال سعودي</option><option value="usd">دولار أمريكي</option><option value="yer">ريال يمني</option>
                                        </select>
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => { setForm({...form, isPaidStatus: true, paidAmount: form.totalAmount}); }} className={`flex-1 py-4 rounded-2xl transition-all ${form.isPaidStatus ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}`}>دفع كامل</button>
                                        <button type="button" onClick={() => { setForm({...form, isPaidStatus: false}); }} className={`flex-1 py-4 rounded-2xl transition-all ${!form.isPaidStatus ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}>دفع جزئي</button>
                                    </div>
                                    
                                    {!form.isPaidStatus && (
                                        <input type="number" placeholder="المبلغ المدفوع" className="w-full border-2 border-slate-200 p-5 rounded-2xl" value={form.paidAmount} onChange={e=>setForm({...form, paidAmount:e.target.value})} />
                                    )}
                                    
                                    <button type="submit" className="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg">{editId ? 'تحديث' : 'تأكيد الإضافة'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* Zakat Modal */}
                    {isZakatModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4" onClick={closeZakatModal}>
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={closeZakatModal}></div>
                            <div className="relative bg-white w-full max-w-md rounded-[3rem] p-8 overflow-y-auto max-h-[90vh] shadow-2xl border-t-4 border-purple-500" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black text-purple-800">{editZakatId ? 'تعديل مال زكاة' : 'إضافة مال زكاة'}</h2><button onClick={closeZakatModal} className="p-3 bg-slate-100 rounded-full text-xl font-bold">×</button></div>
                                <form onSubmit={handleSaveZakat} className="space-y-6">
                                    <input required placeholder="اسم المتبرع / الجهة" className="w-full bg-slate-50 p-5 rounded-2xl text-right" value={zakatForm.name} onChange={e=>setZakatForm({...zakatForm, name:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input required type="number" placeholder="المبلغ" className="bg-slate-50 p-5 rounded-2xl" value={zakatForm.amount} onChange={e=>setZakatForm({...zakatForm, amount:e.target.value})} />
                                        <select className="bg-slate-50 p-5 rounded-2xl" value={zakatForm.currency} onChange={e=>setZakatForm({...zakatForm, currency:e.target.value})}>
                                            <option value="sar">ريال سعودي</option><option value="usd">دولار</option><option value="yer">ريال يمني</option>
                                        </select>
                                    </div>
                                    <select className="w-full bg-slate-100 p-5 rounded-2xl" value={zakatForm.recordedBy} onChange={e=>setZakatForm({...zakatForm, recordedBy:e.target.value})}>
                                        <option>مصطفى الشجاع</option><option>ياسر الشجاع</option><option>عمرو الشجاع</option>
                                    </select>
                                    <button type="submit" className="w-full bg-purple-700 text-white py-5 rounded-2xl font-bold text-lg">{editZakatId ? 'تحديث الزكاة' : 'إضافة الزكاة'}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Expense Modal - Fixed */}
                    {isExpenseModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4" onClick={closeExpenseModal}>
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={closeExpenseModal}></div>
                            <div className="relative bg-white w-full max-w-md rounded-[3rem] p-8 overflow-y-auto max-h-[90vh] shadow-2xl border-t-4 border-rose-500" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black text-rose-800">{editExpenseId ? 'تعديل صرف' : 'تسجيل صرف جديد'}</h2><button onClick={closeExpenseModal} className="p-3 bg-slate-100 rounded-full text-xl font-bold">×</button></div>
                                <form onSubmit={handleSaveExpense} className="space-y-6">
                                    <input required placeholder="اسم المستفيد" className="w-full bg-slate-50 p-5 rounded-2xl text-right" value={expenseForm.beneficiaryName} onChange={e=>setExpenseForm({...expenseForm, beneficiaryName:e.target.value})} />
                                    <select className="w-full bg-slate-50 p-5 rounded-2xl" value={expenseForm.caseType} onChange={e=>setExpenseForm({...expenseForm, caseType:e.target.value})}>
                                        <option>علاج</option><option>إيجار</option><option>غذاء</option><option>كسوة</option><option>تعليم</option><option>أخرى</option>
                                    </select>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input required type="number" placeholder="المبلغ" className="bg-slate-50 p-5 rounded-2xl" value={expenseForm.amount} onChange={e=>setExpenseForm({...expenseForm, amount:e.target.value})} />
                                        <select className="bg-slate-50 p-5 rounded-2xl" value={expenseForm.currency} onChange={e=>setExpenseForm({...expenseForm, currency:e.target.value})}>
                                            <option value="sar">ريال سعودي</option><option value="usd">دولار</option><option value="yer">ريال يمني</option>
                                        </select>
                                    </div>
                                    <input type="date" className="w-full bg-slate-50 p-5 rounded-2xl" value={expenseForm.expenseDate} onChange={e=>setExpenseForm({...expenseForm, expenseDate: e.target.value})} />
                                    <textarea placeholder="ملاحظات إضافية" className="w-full bg-slate-50 p-5 rounded-2xl" rows="3" value={expenseForm.notes} onChange={e=>setExpenseForm({...expenseForm, notes:e.target.value})} />
                                    <select className="w-full bg-slate-100 p-5 rounded-2xl" value={expenseForm.recordedBy} onChange={e=>setExpenseForm({...expenseForm, recordedBy:e.target.value})}>
                                        <option>مصطفى الشجاع</option><option>ياسر الشجاع</option><option>عمرو الشجاع</option>
                                    </select>
                                    <button type="submit" className="w-full bg-rose-600 text-white py-5 rounded-2xl font-bold text-lg">{editExpenseId ? 'تحديث الصرف' : 'تسجيل الصرف'}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Beneficiary Modal - Fixed */}
                    {isBeneficiaryModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4" onClick={closeBeneficiaryModal}>
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={closeBeneficiaryModal}></div>
                            <div className="relative bg-white w-full max-w-md rounded-[3rem] p-8 overflow-y-auto max-h-[90vh] shadow-2xl border-t-4 border-cyan-500" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black text-cyan-800">{editBeneficiaryId ? 'تعديل مستفيد' : 'إضافة حالة مستفيد'}</h2><button onClick={closeBeneficiaryModal} className="p-3 bg-slate-100 rounded-full text-xl font-bold">×</button></div>
                                <form onSubmit={handleSaveBeneficiary} className="space-y-6">
                                    <input required placeholder="اسم المستفيد" className="w-full bg-slate-50 p-5 rounded-2xl text-right" value={beneficiaryForm.name} onChange={e=>setBeneficiaryForm({...beneficiaryForm, name:e.target.value})} />
                                    <select className="w-full bg-slate-50 p-5 rounded-2xl" value={beneficiaryForm.helpType} onChange={e=>setBeneficiaryForm({...beneficiaryForm, helpType:e.target.value})}>
                                        <option>علاج</option><option>إيجار</option><option>غذاء</option><option>كسوة</option><option>تعليم</option><option>أخرى</option>
                                    </select>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input required type="number" placeholder="المبلغ" className="bg-slate-50 p-5 rounded-2xl" value={beneficiaryForm.amount} onChange={e=>setBeneficiaryForm({...beneficiaryForm, amount:e.target.value})} />
                                        <select className="bg-slate-50 p-5 rounded-2xl" value={beneficiaryForm.currency} onChange={e=>setBeneficiaryForm({...beneficiaryForm, currency:e.target.value})}>
                                            <option value="sar">ريال سعودي</option><option value="usd">دولار</option><option value="yer">ريال يمني</option>
                                        </select>
                                    </div>
                                    <select className="w-full bg-slate-50 p-5 rounded-2xl" value={beneficiaryForm.status} onChange={e=>setBeneficiaryForm({...beneficiaryForm, status:e.target.value})}>
                                        <option>مكتمل</option><option>قيد التنفيذ</option><option>قيد الانتظار</option>
                                    </select>
                                    <input type="date" className="w-full bg-slate-50 p-5 rounded-2xl" value={beneficiaryForm.helpDate} onChange={e=>setBeneficiaryForm({...beneficiaryForm, helpDate: e.target.value})} />
                                    <textarea placeholder="ملاحظات إضافية" className="w-full bg-slate-50 p-5 rounded-2xl" rows="3" value={beneficiaryForm.notes} onChange={e=>setBeneficiaryForm({...beneficiaryForm, notes:e.target.value})} />
                                    <select className="w-full bg-slate-100 p-5 rounded-2xl" value={beneficiaryForm.recordedBy} onChange={e=>setBeneficiaryForm({...beneficiaryForm, recordedBy:e.target.value})}>
                                        <option>مصطفى الشجاع</option><option>ياسر الشجاع</option><option>عمرو الشجاع</option>
                                    </select>
                                    <button type="submit" className="w-full bg-cyan-600 text-white py-5 rounded-2xl font-bold text-lg">{editBeneficiaryId ? 'تحديث المستفيد' : 'إضافة المستفيد'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
