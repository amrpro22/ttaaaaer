<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تقديم طلب مساعدة - نظام الصرف المتكامل</title>
    
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
        
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #f0f4fc 0%, #e6edf6 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        /* تحديث الأنماط لتتناسب مع التصميم الجديد - خطوط نظيفة وألوان مميزة */
        .ios-card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
            border: 1px solid rgba(110, 120, 150, 0.12);
            overflow: hidden;
        }
        
        .ios-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 42px -14px rgba(0, 0, 0, 0.12);
        }
        
        /* بطاقات متعددة الألوان */
        .card-primary {
            background: linear-gradient(135deg, #ffffff 0%, #fefcff 100%);
            border-top: 4px solid #5b8cce;
        }
        
        .card-success {
            background: linear-gradient(115deg, #f6f9ff 0%, #ffffff 100%);
            border-right: 4px solid #3c9e6d;
        }
        
        .btn-press:active { transform: scale(0.97); transition: transform 0.05s; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .status-pending { background: #fff8ed; border-right: 4px solid #e2a14f; }
        .status-approved { background: #edf7f0; border-right: 4px solid #3c9e6d; }
        .status-rejected { background: #feeceb; border-right: 4px solid #bc3f2e; }
        
        .ios-button-primary {
            background: #2b6e9e;
            color: white;
            border-radius: 18px;
            font-weight: 590;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(43, 110, 158, 0.2);
        }
        
        .ios-button-primary:active {
            background: #1f5480;
            transform: scale(0.98);
        }
        
        .ios-input {
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 12px 16px;
            width: 100%;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .ios-input:focus {
            outline: none;
            border-color: #5b8cce;
            box-shadow: 0 0 0 3px rgba(91, 140, 206, 0.1);
        }
        
        .ios-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .toast-notification {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        
        .toast-content {
            background: #1c2c48;
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 14px 24px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            pointer-events: auto;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBzX7_q2Abx0pL9L5aMvzJ6I3hDdc8bXy8",
            authDomain: "magdi-50c75.firebaseapp.com",
            databaseURL: "https://magdi-50c75-default-rtdb.firebaseio.com",
            projectId: "magdi-50c75",
            storageBucket: "magdi-50c75.firebasestorage.app",
            messagingSenderId: "329518389376",
            appId: "1:329518389376:web:f2f73f4a257dcb84efee65"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // Types of cases
        const caseTypes = [
            { value: 'accident', label: 'حادث' },
            { value: 'disease', label: 'مرض' },
            { value: 'treatment', label: 'علاج' },
            { value: 'travelTreatment', label: 'سفر للعلاج' },
            { value: 'zakatCharity', label: 'صدقة من مال الزكاة' },
            { value: 'financialAid', label: 'مساعدة مالية' },
            { value: 'other', label: 'أخرى' }
        ];

        // عداد ثابت لبدء أرقام الطلبات من 100
        const SEQUENCE_KEY = 'requestSequenceCounter';
        
        async function getNextRequestNumber() {
            const sequenceRef = database.ref(SEQUENCE_KEY);
            let currentNumber = 100;
            
            const result = await sequenceRef.transaction((currentValue) => {
                if (currentValue === null) {
                    return currentNumber;
                }
                return currentValue + 1;
            });
            
            if (result.snapshot && result.snapshot.val() !== null) {
                return result.snapshot.val();
            }
            return currentNumber;
        }

        const App = () => {
            const [view, setView] = useState('form');
            const [submittedRequest, setSubmittedRequest] = useState(null);
            const [trackingId, setTrackingId] = useState('');
            const [trackedRequest, setTrackedRequest] = useState(null);
            const [geoInfo, setGeoInfo] = useState({ location: 'جاري التحديد...' });
            const [notification, setNotification] = useState(null);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 3000);
            };

            useEffect(() => {
                fetch('https://ipapi.co/json/')
                    .then(res => res.json())
                    .then(data => setGeoInfo({ location: data.country_name || 'السعودية/اليمن' }))
                    .catch(() => setGeoInfo({ location: 'اليمن' }));
            }, []);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
            }, []);

            return (
                <div className="min-h-screen py-6 px-4">
                    <div className="max-w-2xl mx-auto">
                        
                        {/* Custom Notification Toast */}
                        {notification && (
                            <div className="toast-notification fade-in">
                                <div className={`toast-content ${notification.type === 'error' ? 'bg-red-600 text-white' : 'bg-[#2b6e9e] text-white'}`}>
                                    <div className="flex items-center gap-3">
                                        <span>{notification.type === 'error' ? '⚠️' : '✓'}</span>
                                        <span>{notification.message}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Header */}
                        <div className="text-center mb-8">
                            <div className="inline-block p-4 bg-white/80 backdrop-blur rounded-full mb-4 shadow-md">
                                <span className="text-5xl">📝</span>
                            </div>
                            <h1 className="text-3xl font-bold" style={{ background: 'linear-gradient(135deg, #1e3a5f, #2c5a7a)', backgroundClip: 'text', WebkitBackgroundClip: 'text', color: 'transparent' }}>تقديم طلب مساعدة</h1>
                            <p className="text-[#4a5b7a] mt-2">نظام الصرف المتكامل - صندوق الحالات الطارئة</p>
                        </div>

                        {/* Toggle Buttons */}
                        <div className="flex gap-3 mb-6">
                            <button 
                                onClick={() => { setView('form'); setSubmittedRequest(null); }}
                                className={`flex-1 py-3 rounded-2xl font-bold transition-all btn-press ${view === 'form' ? 'bg-[#2b6e9e] text-white shadow-md' : 'bg-white/80 text-[#4a5b7a] border border-gray-200'}`}
                            >
                                تقديم طلب جديد
                            </button>
                            <button 
                                onClick={() => { setView('track'); setTrackedRequest(null); }}
                                className={`flex-1 py-3 rounded-2xl font-bold transition-all btn-press ${view === 'track' ? 'bg-[#2b6e9e] text-white shadow-md' : 'bg-white/80 text-[#4a5b7a] border border-gray-200'}`}
                            >
                                متابعة طلب
                            </button>
                        </div>

                        {/* Request Form */}
                        {view === 'form' && !submittedRequest && (
                            <RequestForm 
                                onSubmit={(requestId, requestNumber) => setSubmittedRequest({ id: requestId, number: requestNumber, status: 'pending' })} 
                                geoInfo={geoInfo} 
                                caseTypes={caseTypes} 
                                showNotification={showNotification}
                            />
                        )}
                        
                        {/* Submission Result */}
                        {submittedRequest && <SubmissionResult request={submittedRequest} onNewRequest={() => setSubmittedRequest(null)} showNotification={showNotification} />}
                        
                        {/* Track Request */}
                        {view === 'track' && (
                            <TrackRequest 
                                trackingId={trackingId} 
                                setTrackingId={setTrackingId} 
                                trackedRequest={trackedRequest} 
                                setTrackedRequest={setTrackedRequest} 
                                showNotification={showNotification}
                            />
                        )}
                    </div>
                </div>
            );
        };

        // Request Form Component
        const RequestForm = ({ onSubmit, geoInfo, caseTypes, showNotification }) => {
            const [formData, setFormData] = useState({
                caseName: '',
                caseDetails: '',
                caseType: '',
                requesterName: '',
                requestDate: new Date().toISOString().split('T')[0],
                urgencyLevel: 'urgent',
                incomeReport: '',
                requestAmount: '',
                preferredCurrency: 'yer'
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                try {
                    const requestNumber = await getNextRequestNumber();
                    const newRequestRef = database.ref('assistanceRequests').push();
                    const requestId = newRequestRef.key;
                    
                    await newRequestRef.set({
                        ...formData,
                        requestId: requestId,
                        requestNumber: requestNumber,
                        location: geoInfo.location,
                        status: 'pending',
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        votes: {}
                    });
                    
                    showNotification('تم إرسال طلبك بنجاح!');
                    onSubmit(requestId, requestNumber);
                } catch (error) {
                    console.error(error);
                    showNotification('حدث خطأ في إرسال الطلب، يرجى المحاولة لاحقاً', 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="ios-card card-primary p-6 fade-in">
                    <form onSubmit={handleSubmit} className="space-y-5">
                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">اسم الحالة *</label>
                                <input type="text" required className="ios-input" 
                                    value={formData.caseName} onChange={(e) => setFormData({...formData, caseName: e.target.value})}
                                    placeholder="مثال: حالة عائلة أحمد" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">اسم مقدم الحالة *</label>
                                <input type="text" required className="ios-input" 
                                    value={formData.requesterName} onChange={(e) => setFormData({...formData, requesterName: e.target.value})}
                                    placeholder="الاسم الكامل" />
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">نوع الحالة *</label>
                            <select required className="ios-input" 
                                value={formData.caseType} onChange={(e) => setFormData({...formData, caseType: e.target.value})}>
                                <option value="">اختر نوع الحالة</option>
                                {caseTypes.map(type => (
                                    <option key={type.value} value={type.value}>{type.label}</option>
                                ))}
                            </select>
                        </div>

                        <div>
                            <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">تفاصيل شاملة عن الحالة *</label>
                            <textarea required rows="5" className="ios-input resize-none" 
                                value={formData.caseDetails} onChange={(e) => setFormData({...formData, caseDetails: e.target.value})}
                                placeholder="اذكر جميع التفاصيل المتعلقة بالحالة بشكل دقيق..."></textarea>
                        </div>

                        <div>
                            <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">تقرير شامل عن مستوى دخل الحالة *</label>
                            <textarea required rows="4" className="ios-input resize-none" 
                                value={formData.incomeReport} onChange={(e) => setFormData({...formData, incomeReport: e.target.value})}
                                placeholder="صف مصادر الدخل، عدد أفراد الأسرة، الظروف المادية، الالتزامات الشهرية..."></textarea>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">المبلغ المطلوب</label>
                                <input type="number" className="ios-input" 
                                    value={formData.requestAmount} onChange={(e) => setFormData({...formData, requestAmount: e.target.value})}
                                    placeholder="المبلغ" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">العملة</label>
                                <select className="ios-input" 
                                    value={formData.preferredCurrency} onChange={(e) => setFormData({...formData, preferredCurrency: e.target.value})}>
                                    <option value="yer">ريال يمني</option>
                                    <option value="sar">ريال سعودي</option>
                                    <option value="usd">دولار</option>
                                </select>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">التاريخ *</label>
                                <input type="date" required className="ios-input" 
                                    value={formData.requestDate} onChange={(e) => setFormData({...formData, requestDate: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-[#1e3a5f] mb-2">مستوى تقديم الطلب *</label>
                                <div className="flex gap-4 pt-2">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" value="urgent" checked={formData.urgencyLevel === 'urgent'} 
                                            onChange={(e) => setFormData({...formData, urgencyLevel: e.target.value})} />
                                        <span className="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm font-bold">مستعجل</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input type="radio" value="notUrgent" checked={formData.urgencyLevel === 'notUrgent'} 
                                            onChange={(e) => setFormData({...formData, urgencyLevel: e.target.value})} />
                                        <span className="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-bold">غير مستعجل</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div className="bg-[#f7f9fe] p-3 rounded-2xl text-sm text-[#6b7c9e]">
                            موقع التقديم الحالي: {geoInfo.location}
                        </div>

                        <button type="submit" disabled={isSubmitting} 
                            className="w-full ios-button-primary py-4 rounded-2xl font-bold text-lg transition-all disabled:opacity-50 btn-press">
                            {isSubmitting ? 'جاري الإرسال...' : 'إرسال الطلب'}
                        </button>
                    </form>
                </div>
            );
        };

        // Submission Result Component
        const SubmissionResult = ({ request, onNewRequest, showNotification }) => {
            const [currentStatus, setCurrentStatus] = useState(request.status);
            const [copySuccess, setCopySuccess] = useState(false);
            
            useEffect(() => {
                const statusRef = database.ref(`assistanceRequests/${request.id}/status`);
                const unsubscribe = statusRef.on('value', (snapshot) => {
                    const status = snapshot.val();
                    if (status) setCurrentStatus(status);
                });
                return () => statusRef.off();
            }, [request.id]);

            const copyRequestNumber = () => {
                const requestNumber = request.number;
                navigator.clipboard.writeText(requestNumber.toString()).then(() => {
                    setCopySuccess(true);
                    showNotification('تم نسخ رقم الطلب بنجاح!');
                    setTimeout(() => setCopySuccess(false), 2000);
                }).catch(() => {
                    showNotification('فشل نسخ الرقم، حاول يدوياً', 'error');
                });
            };

            const getStatusContent = () => {
                switch(currentStatus) {
                    case 'pending':
                        return { icon: '⏳', title: 'قيد المراجعة', color: 'text-[#e2a14f]', bg: 'bg-[#fff8ed]', message: 'تم استلام طلبك بنجاح، وهو قيد المراجعة من قبل الفريق المسؤول' };
                    case 'approved':
                        return { icon: '✓', title: 'تمت الموافقة على الطلب', color: 'text-[#3c9e6d]', bg: 'bg-[#edf7f0]', message: 'تمت الموافقة على طلبك، سيتم التواصل معك قريباً' };
                    case 'rejected':
                        return { icon: '✗', title: 'تم رفض الطلب', color: 'text-[#bc3f2e]', bg: 'bg-[#feeceb]', message: 'نأسف لرفض طلبك، يمكنك التواصل مع الإدارة لمعرفة الأسباب' };
                    default:
                        return { icon: '⏳', title: 'قيد المراجعة', color: 'text-[#e2a14f]', bg: 'bg-[#fff8ed]', message: 'جاري مراجعة طلبك' };
                }
            };

            const statusContent = getStatusContent();

            return (
                <div className="ios-card p-8 text-center fade-in card-success">
                    <div className={`inline-block p-4 ${statusContent.bg} rounded-2xl mb-6`}>
                        <span className="text-5xl">{statusContent.icon}</span>
                    </div>
                    
                    <h2 className={`text-2xl font-bold ${statusContent.color} mb-4`}>{statusContent.title}</h2>
                    
                    <p className="text-[#6b7c9e] mb-6">{statusContent.message}</p>
                    
                    <div className="bg-[#f7f9fe] rounded-2xl p-5 mb-6">
                        <p className="text-sm text-[#6b7c9e] mb-2">رقم الطلب المرجعي:</p>
                        <div className="flex items-center justify-center gap-3 flex-wrap">
                            <p className="text-3xl font-mono font-bold text-[#2b6e9e]">
                                {request.number}
                            </p>
                            <button 
                                onClick={copyRequestNumber}
                                className={`flex items-center gap-2 px-4 py-2 rounded-xl font-bold transition-all btn-press ${
                                    copySuccess ? 'bg-[#3c9e6d] text-white' : 'bg-[#eef2fa] text-[#2b6e9e] hover:bg-[#e2e8f2]'
                                }`}
                            >
                                <span className="text-lg">{copySuccess ? '✓' : '📋'}</span>
                                <span className="text-sm">{copySuccess ? 'تم النسخ' : 'نسخ الرقم'}</span>
                            </button>
                        </div>
                        <p className="text-xs text-[#8e9eae] mt-3">احتفظ بهذا الرقم لمتابعة طلبك</p>
                    </div>

                    <div className="flex gap-3">
                        <button onClick={onNewRequest} 
                            className="flex-1 ios-button-primary py-3 rounded-xl font-bold btn-press">
                            تقديم طلب جديد
                        </button>
                        <button onClick={() => window.location.reload()} 
                            className="flex-1 bg-[#e9ecef] text-[#4a5b7a] py-3 rounded-xl font-bold btn-press">
                            الصفحة الرئيسية
                        </button>
                    </div>

                    <div className="mt-6 pt-6 border-t border-gray-100">
                        <p className="text-xs text-[#8e9eae]">
                            سيتم تحديث حالة الطلب تلقائياً عند المراجعة
                        </p>
                    </div>
                </div>
            );
        };

        // Track Request Component
        const TrackRequest = ({ trackingId, setTrackingId, trackedRequest, setTrackedRequest, showNotification }) => {
            const [isLoading, setIsLoading] = useState(false);

            const checkStatus = async () => {
                if (!trackingId.trim()) {
                    showNotification('الرجاء إدخال رقم الطلب أولاً', 'error');
                    return;
                }
                setIsLoading(true);
                
                const requestsRef = database.ref('assistanceRequests');
                requestsRef.orderByChild('requestNumber').equalTo(parseInt(trackingId.trim())).once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const requestKey = Object.keys(data)[0];
                        const requestData = data[requestKey];
                        setTrackedRequest({ id: requestKey, number: requestData.requestNumber, ...requestData });
                        showNotification('تم العثور على الطلب بنجاح!');
                    } else {
                        showNotification('لم يتم العثور على الرقم المرجعي للطلب', 'error');
                        setTrackedRequest(null);
                    }
                    setIsLoading(false);
                }).catch((error) => {
                    console.error(error);
                    showNotification('حدث خطأ في البحث', 'error');
                    setIsLoading(false);
                });
            };

            const getStatusDisplay = (status) => {
                switch(status) {
                    case 'pending': return { text: 'قيد المراجعة', bg: 'status-pending' };
                    case 'approved': return { text: 'تمت الموافقة', bg: 'status-approved' };
                    case 'rejected': return { text: 'تم الرفض', bg: 'status-rejected' };
                    default: return { text: 'قيد المراجعة', bg: 'status-pending' };
                }
            };

            const getCaseTypeLabel = (typeValue) => {
                const types = {
                    'accident': 'حادث', 'disease': 'مرض', 'treatment': 'علاج',
                    'travelTreatment': 'سفر للعلاج', 'marriage': 'زواج',
                    'zakatCharity': 'صدقة زكاة', 'financialAid': 'مساعدة مالية', 'other': 'أخرى'
                };
                return types[typeValue] || typeValue;
            };

            return (
                <div className="ios-card p-6 fade-in card-primary">
                    <h3 className="text-lg font-bold mb-5 text-center text-[#1e3a5f]">متابعة طلب مساعدة</h3>
                    
                    <div className="flex gap-3 mb-6">
                        <input type="text" 
                            placeholder="أدخل رقم الطلب (رقم مرجعي يبدأ من 100)" 
                            className="ios-input text-left"
                            dir="ltr"
                            value={trackingId} 
                            onChange={(e) => setTrackingId(e.target.value)} />
                        <button onClick={checkStatus} disabled={isLoading}
                            className="ios-button-primary px-6 py-3 rounded-xl font-bold btn-press disabled:opacity-50 min-w-[90px]">
                            {isLoading ? 'جاري...' : 'بحث'}
                        </button>
                    </div>

                    {trackedRequest && (
                        <div className={`rounded-2xl p-5 ${getStatusDisplay(trackedRequest.status).bg} fade-in`}>
                            <div className="flex justify-between items-start mb-4 flex-wrap gap-2 border-b border-black/10 pb-3">
                                <div>
                                    <h4 className="font-bold text-lg text-[#1e3a5f]">{trackedRequest.caseName}</h4>
                                    <p className="text-sm text-[#6b7c9e] mt-1">مقدم الطلب: {trackedRequest.requesterName}</p>
                                </div>
                                <div className="text-2xl">{getStatusDisplay(trackedRequest.status).text === 'قيد المراجعة' ? '⏳' : getStatusDisplay(trackedRequest.status).text === 'تمت الموافقة' ? '✓' : '✗'}</div>
                            </div>
                            
                            <div className="space-y-3 text-sm">
                                <p><span className="font-bold text-[#1e3a5f]">نوع الحالة:</span> <span className="text-[#4a5b7a]">{getCaseTypeLabel(trackedRequest.caseType)}</span></p>
                                <p><span className="font-bold text-[#1e3a5f]">تاريخ التقديم:</span> <span className="text-[#4a5b7a]">{trackedRequest.requestDate}</span></p>
                                {trackedRequest.requestAmount && (
                                    <p><span className="font-bold text-[#1e3a5f]">المبلغ المطلوب:</span> <span className="text-[#4a5b7a]">{parseFloat(trackedRequest.requestAmount).toLocaleString()} 
                                        {trackedRequest.preferredCurrency === 'sar' ? ' ر.س' : trackedRequest.preferredCurrency === 'usd' ? ' $' : ' ي.ي'}</span></p>
                                )}
                                <p><span className="font-bold text-[#1e3a5f]">مستوى الاستعجال:</span> 
                                    {trackedRequest.urgencyLevel === 'urgent' ? <span className="text-red-600"> مستعجل</span> : <span className="text-green-600"> غير مستعجل</span>}</p>
                                <div className="bg-white/50 p-3 rounded-xl mt-2">
                                    <span className="font-bold block mb-1 text-xs text-[#8e9eae]">ملخص الحالة:</span>
                                    <p className="text-[#4a5b7a] leading-relaxed whitespace-pre-line text-sm">{trackedRequest.caseDetails}</p>
                                </div>
                            </div>

                            <div className="mt-4 pt-3 border-t border-black/10 text-center">
                                <p className="text-sm font-bold text-[#1e3a5f]">
                                    حالة الطلب الحالية: {getStatusDisplay(trackedRequest.status).text}
                                </p>
                                {trackedRequest.reviewedAt && (
                                    <p className="text-xs text-[#8e9eae] mt-2">
                                        تمت المراجعة بتاريخ: {new Date(trackedRequest.reviewedAt).toLocaleDateString('ar-SA')}
                                    </p>
                                )}
                            </div>
                        </div>
                    )}

                    <div className="mt-6 text-center text-xs text-[#8e9eae]">
                        <p>سيتم تحديث هذه الصفحة فور مراجعة طلبك</p>
                        <p className="mt-1">يمكنك استخدام نفس الرقم لمتابعة حالة الطلب في أي وقت</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
