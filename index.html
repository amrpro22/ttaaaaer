
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>لوحة تسجيل المصروفات - Realtime Mode</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body{
            background:#f8fafc;
            padding:15px;
            color: #1e293b;
            overflow-x: hidden;
        }

        .container{
            max-width:800px;
            margin:auto;
        }

        .card{
            background:#fff;
            border-radius:20px;
            padding:25px;
            box-shadow:0 15px 35px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #f1f5f9;
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .title{
            color:#1e3a8a;
            font-size:26px;
            font-weight:800;
            margin-bottom: 8px;
        }

        .sync-info {
            color: #64748b;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sync-icon {
            width: 10px;
            height: 10px;
            background: #cbd5e1;
            border-radius: 50%;
            transition: 0.3s;
        }

        .online { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .full{ grid-column: 1 / -1; }

        label{
            display:block;
            margin-bottom:6px;
            color:#475569;
            font-weight:600;
            font-size:13px;
        }

        input, select, textarea{
            width:100%;
            padding:14px;
            border:1.5px solid #e2e8f0;
            border-radius:12px;
            outline:none;
            font-size:16px; 
            transition:0.2s;
            background:#ffffff;
            appearance: none;
            -webkit-appearance: none;
        }

        input:focus, select:focus, textarea:focus{
            border-color:#2563eb;
            box-shadow:0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        textarea{
            min-height:90px;
            resize: none;
        }

        .amount-box{
            display:flex;
            gap:8px;
        }

        .amount-box input { flex: 1; }
        .amount-box select { width: 120px; }

        .btn{
            width:100%;
            margin-top:20px;
            border:none;
            background:#2563eb;
            color:white;
            padding:16px;
            border-radius:15px;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;
            transition:0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:active{ transform: scale(0.98); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .history-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .history-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1e3a8a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-list { display: flex; flex-direction: column; gap: 12px; }

        .expense-item {
            border: 1px solid #f1f5f9;
            border-radius: 15px;
            padding: 15px;
            background: #ffffff;
            transition: 0.2s;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .item-beneficiary { font-weight: 700; color: #0f172a; }
        .item-amount { color: #16a34a; font-weight: 800; font-size: 1.1rem; }
        .item-details { font-size: 14px; color: #64748b; margin: 8px 0; line-height: 1.5; }
        
        .item-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #f8fafc;
            padding-top: 8px;
            margin-top: 5px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            background: #f1f5f9;
            color: #475569;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #f1f5f9;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media(max-width:600px){
            .grid { grid-template-columns: 1fr; }
        }

        .credits {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
        .credits b { color: #334155; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: #1e3a8a; font-weight: bold;">جاري معالجة الطلب...</p>
</div>

<div class="container">
    <div class="card">
        <div class="header-section">
            <div class="title">لوحة تسجيل المصروفات</div>
            <div class="sync-info">
                <span class="sync-icon" id="statusIcon"></span>
                <span id="statusText">جاري الاتصال بـ Realtime DB...</span>
            </div>
        </div>

        <form id="expenseForm">
            <div class="grid">
                <div>
                    <label>اسم المستفيد</label>
                    <input type="text" id="beneficiaryName" placeholder="أدخل الاسم الرباعي" required>
                </div>

                <div>
                    <label>نوع الحالة</label>
                    <select id="caseType" required>
                        <option value="">-- اختر النوع --</option>
                        <option value="حالة مرضية">حالة مرضية</option>
                        <option value="مساعدة مالية">مساعدة مالية</option>
                        <option value="حالة وفاة">حالة وفاة</option>
                        <option value="حادث">حادث</option>
                        <option value="حالة إنسانية">حالة إنسانية</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>

                <div class="full">
                    <label>التفاصيل والملاحظات</label>
                    <textarea id="caseDetails" placeholder="اكتب شرحاً مختصراً للحالة..."></textarea>
                </div>

                <div>
                    <label>المبلغ</label>
                    <div class="amount-box">
                        <input type="number" id="amount" placeholder="0.00" required>
                        <select id="currency">
                            <option value="ريال يمني">ريال يمني</option>
                            <option value="ريال سعودي">ريال سعودي</option>
                            <option value="دولار">دولار</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label>تاريخ الصرف</label>
                    <input type="date" id="date" required>
                </div>

                <div class="full">
                    <label>مدخل البيانات</label>
                    <input type="text" id="addedBy" placeholder="اسمك الكامل" required>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span>حفظ البيانات سحابياً</span>
            </button>
        </form>

        <div class="credits">
            <span>إشراف : <b>مصطفى الشجاع</b></span> | 
            <span>تطوير : <b>عمرو مسعد الشجاع</b></span>
        </div>
    </div>

    <div class="history-card">
        <div class="history-title">
            <span>آخر السجلات</span>
            <span id="recordCount" style="font-size: 13px; color: #64748b;">...</span>
        </div>
        <div id="expenseList" class="expense-list">
            <p style="text-align: center; color: #94a3b8; padding: 15px; font-size: 14px;">جاري تحميل السجلات...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // إعدادات مشروع magdi-50c75
    const firebaseConfig = {
      apiKey: "AIzaSyBzX7_q2Abx0pL9L5aMvzJ6I3hDdc8bXy8",
      authDomain: "magdi-50c75.firebaseapp.com",
      databaseURL: "https://magdi-50c75-default-rtdb.firebaseio.com", // رابط Realtime Database
      projectId: "magdi-50c75",
      storageBucket: "magdi-50c75.firebasestorage.app",
      messagingSenderId: "329518389376",
      appId: "1:329518389376:web:f2f73f4a257dcb84efee65"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbPath = "expenses"; // المسار الذي سيتم الحفظ فيه

    // تحديث الحالة عند الاتصال
    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
        const statusIcon = document.getElementById("statusIcon");
        const statusText = document.getElementById("statusText");
        if (snap.val() === true) {
            statusIcon.classList.add("online");
            statusText.innerText = "متصل بـ Realtime Database";
        } else {
            statusIcon.classList.remove("online");
            statusText.innerText = "فصل الاتصال.. جاري المحاولة";
        }
    });

    // جلب البيانات لحظياً
    function fetchData() {
        const expensesRef = ref(db, dbPath);
        onValue(expensesRef, (snapshot) => {
            const list = document.getElementById("expenseList");
            const count = document.getElementById("recordCount");
            list.innerHTML = "";
            
            const data = snapshot.val();
            if (!data) {
                list.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 20px;">لا توجد سجلات بعد.</p>';
                count.innerText = "0 سجل محفوظ";
                return;
            }

            const docs = Object.keys(data).map(key => ({id: key, ...data[key]}));
            
            // ترتيب الأحدث أولاً
            docs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            count.innerText = `${docs.length} سجل محفوظ`;

            docs.forEach(item => {
                const div = document.createElement("div");
                div.className = "expense-item";
                div.innerHTML = `
                    <div class="item-header">
                        <span class="item-beneficiary">${item.beneficiaryName}</span>
                        <span class="item-amount">${item.amount} <small>${item.currency}</small></span>
                    </div>
                    <div class="badge">${item.caseType}</div>
                    <div class="item-details">${item.caseDetails || 'لا توجد ملاحظات إضافية'}</div>
                    <div class="item-footer">
                        <span>📅 ${item.date}</span>
                        <span>👤 مدخل: ${item.addedBy}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        });
    }

    fetchData();

    // إرسال البيانات
    const form = document.getElementById("expenseForm");
    const loader = document.getElementById("loadingOverlay");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        loader.style.display = "flex";

        const payload = {
            beneficiaryName: document.getElementById("beneficiaryName").value,
            caseType: document.getElementById("caseType").value,
            caseDetails: document.getElementById("caseDetails").value,
            amount: document.getElementById("amount").value,
            currency: document.getElementById("currency").value,
            date: document.getElementById("date").value,
            addedBy: document.getElementById("addedBy").value,
            timestamp: serverTimestamp() // وقت السيرفر للترتيب
        };

        try {
            const newListRef = push(ref(db, dbPath));
            await set(newListRef, payload);
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            alert("تم الحفظ بنجاح!");
        } catch (err) {
            console.error(err);
            alert("فشل الحفظ: تأكد أنك في قسم Realtime Database وليس Firestore.");
        } finally {
            loader.style.display = "none";
        }
    });

    window.onload = () => {
        document.getElementById('date').valueAsDate = new Date();
    };
</script>
</body>
</html>
```
