        const { useState, useEffect, useMemo, useCallback } = React;

        // Firebase Configs
        const firebaseConfig = {

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        let rtApp;
        try { rtApp = firebase.app('rtApp'); } catch(e) { rtApp = firebase.initializeApp(rtConfig, 'rtApp'); }
        const rtDb = firebase.database(rtApp);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_PATH = "amr4admin";

        // ✅ TEAM MEMBERS - مجدي عبدة علي صلاحياته مشاهدة فقط
        const teamMembers = [
            { name: 'مصطفى الشجاع', role: 'المشرف العام', icon: '👑', password: '1992', permissions: ['all'] },
            { name: 'مجدي عبدة علي', role: 'المدير المالي', icon: '💰', password: '2111', permissions: ['viewer'] },  // 🔴 مشاهدة فقط
            { name: 'ياسر الشجاع', role: 'التدقيق وإدخال البيانات', icon: '✅', password: '1112', permissions: ['all'] },
            { name: 'عمرو مسعد الشجاع', role: 'مطور النظام', icon: '💻', password: '1993', permissions: ['all'] }
        ];

        const calculateExpiryDate = (startDate, duration) => {
            const start = new Date(startDate);
            switch(duration) {
                case '3 months': return new Date(start.setMonth(start.getMonth() + 3));
                case '6 months': return new Date(start.setMonth(start.getMonth() + 6));
                case '1 year': return new Date(start.setFullYear(start.getFullYear() + 1));
                default: return new Date(start.setMonth(start.getMonth() + 3));
            }
        };

        const getSubscriptionStatus = (expiryDate) => {
            const now = new Date();
            const expiry = new Date(expiryDate);
            const daysUntilExpiry = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
            
            if (now > expiry) return 'expired';
            if (daysUntilExpiry <= 7) return 'expiring';
            return 'active';
        };

        const validateSubscriptionData = (data) => {
            if (!data.name || data.name.trim() === '') return false;
            if (!data.totalAmount || parseFloat(data.totalAmount) <= 0) return false;
            if (!data.paidAmount || parseFloat(data.paidAmount) < 0) return false;
            if (parseFloat(data.paidAmount) > parseFloat(data.totalAmount)) return false;
            return true;
        };

        const App = () => {
            const [allRecords, setAllRecords] = useState([]); 
            const [filter, setFilter] = useState('all'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editId, setEditId] = useState(null);
            const [isPdfLoading, setIsPdfLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [geoInfo, setGeoInfo] = useState({ location: 'تحديد...' });
            const [activeTab, setActiveTab] = useState('emergency');
            
            const [currentUser, setCurrentUser] = useState(null);
            const [showLogin, setShowLogin] = useState(true);
            const [loginName, setLoginName] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [assistanceRequests, setAssistanceRequests] = useState([]);
            const [requestFilter, setRequestFilter] = useState('all');
            const [showRequestForm, setShowRequestForm] = useState(false);
            const [submittedRequest, setSubmittedRequest] = useState(null);
            const [trackingId, setTrackingId] = useState('');
            
            const [expensesList, setExpensesList] = useState([]);
            const [expenseForm, setExpenseForm] = useState({
                beneficiaryName: '', caseType: '', caseDetails: '', amount: '', currency: 'ريال يمني',
                date: new Date().toISOString().split('T')[0], addedBy: ''
            });
            const [isExpenseLoading, setIsExpenseLoading] = useState(false);
            const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
            
            const [zakatForm, setZakatForm] = useState({ name: '', amount: '', currency: 'yer', recordedBy: '' });
            const [editZakatId, setEditZakatId] = useState(null);
            const [isZakatModalOpen, setIsZakatModalOpen] = useState(false);
            const [form, setForm] = useState({ 
                name: '', recordedBy: '', totalAmount: '', paidAmount: '', 
                currency: 'sar', duration: '3 months', isPaidStatus: false,
                startDate: new Date().toISOString().split('T')[0],
                expiryDate: '',
                subscriptionStatus: 'active'
            });
            
            const [requestFormData, setRequestFormData] = useState({
                caseName: '', caseDetails: '', caseType: '', requesterName: '',
                requestDate: new Date().toISOString().split('T')[0], urgencyLevel: 'urgent',
                incomeReport: '', status: 'pending', requestAmount: '', preferredCurrency: 'yer'
            });

            const caseTypes = [
                { value: 'accident', label: 'حادث', icon: '🚗' },
                { value: 'disease', label: 'مرض', icon: '🏥' },
                { value: 'treatment', label: 'علاج', icon: '💊' },
                { value: 'travelTreatment', label: 'سفر للعلاج', icon: '✈️' },
                { value: 'marriage', label: 'زواج', icon: '💑' },
                { value: 'zakatCharity', label: 'صدقة زكاة', icon: '🕌' },
                { value: 'financialAid', label: 'مساعدة مالية', icon: '💰' },
                { value: 'other', label: 'أخرى', icon: '📌' }
            ];

            // ✅ دالة التحقق من صلاحية التعديل - مجدي فقط لا تظهر له الأزرار
            const canEdit = () => {
                return currentUser?.permissions?.includes('all') || false;
            };

            const handleLogin = () => {
                const user = teamMembers.find(m => m.name === loginName && m.password === loginPassword);
                if (user) {
                    setCurrentUser(user);
                    setShowLogin(false);
                    setLoginError('');
                    setForm(prev => ({ ...prev, recordedBy: user.name }));
                    setZakatForm(prev => ({ ...prev, recordedBy: user.name }));
                    setExpenseForm(prev => ({ ...prev, addedBy: user.name }));
                } else {
                    setLoginError('الاسم أو كلمة المرور غير صحيحة');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setShowLogin(true);
                setLoginName('');
                setLoginPassword('');
            };

            useEffect(() => {
                const requestsRef = rtDb.ref('assistanceRequests');
                const onRequestsChange = (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        setAssistanceRequests(list);
                    } else setAssistanceRequests([]);
                };
                requestsRef.on('value', onRequestsChange);
                return () => requestsRef.off('value', onRequestsChange);
            }, []);

            useEffect(() => {
                const expensesRef = rtDb.ref('expenses');
                const onExpensesChange = (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setExpensesList(list);
                    } else setExpensesList([]);
                };
                expensesRef.on('value', onExpensesChange);
                return () => expensesRef.off('value', onExpensesChange);
            }, []);

            useEffect(() => {
                fetch('https://ipapi.co/json/')
                    .then(res => res.json())
                    .then(data => setGeoInfo({ location: data.country_name || 'السعودية/اليمن' }))
                    .catch(() => setGeoInfo({ location: 'السعودية/اليمن' }));
            }, []);

            useEffect(() => { 
                auth.signInAnonymously().catch(console.error); 
            }, []);

            useEffect(() => {
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                const unsubscribe = ref.onSnapshot(snap => {
                    const records = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const updatedRecords = records.map(record => {
                        if (record.type !== 'zakat' && record.startDate && record.expiryDate) {
                            const status = getSubscriptionStatus(record.expiryDate);
                            if (record.subscriptionStatus !== status) {
                                if (status === 'expired' && record.subscriptionStatus !== 'expired') {
                                    ref.doc(record.id).update({ subscriptionStatus: status });
                                }
                                return { ...record, subscriptionStatus: status };
                            }
                        }
                        return record;
                    });
                    setAllRecords(updatedRecords);
                });
                return () => unsubscribe();
            }, []);

            const donors = useMemo(() => allRecords.filter(record => !record.type || record.type !== 'zakat'), [allRecords]);
            const zakatRecords = useMemo(() => allRecords.filter(record => record.type === 'zakat'), [allRecords]);

            const parseInfo = useCallback((d) => {
                if (d.startDate && d.expiryDate && d.totalAmount && d.paidAmount) {
                    const total = parseFloat(d.totalAmount);
                    const paid = parseFloat(d.paidAmount);
                    let duration = d.duration || '3 months';
                    let curr = d.currency || 'sar';
                    const progress = total > 0 ? Math.min(100, (paid / total) * 100) : 0;
                    let progressColor = progress >= 100 ? '#34c759' : (progress > 50 ? '#007aff' : (progress > 0 ? '#ff9500' : '#ff3b30'));
                    let durationText = duration === '3 months' ? '3 أشهر' : duration === '6 months' ? '6 أشهر' : duration === '1 year' ? 'سنة' : 'غير محدد';
                    const recordDate = d.startDate;
                    const formattedDate = recordDate ? new Date(recordDate).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }) : 'تاريخ غير محدد';
                    const status = d.subscriptionStatus || getSubscriptionStatus(d.expiryDate);
                    
                    let statusText = '';
                    let statusColor = '';
                    if (status === 'active') { statusText = 'نشط'; statusColor = '#34c759'; }
                    else if (status === 'expiring') { statusText = 'ينتهي قريباً'; statusColor = '#ff9500'; }
                    else if (status === 'expired') { statusText = 'منتهي'; statusColor = '#ff3b30'; }
                    
                    return { total, paid, remaining: Math.max(0, total - paid), curr, progress, progressColor, durationText, formattedDate, status, statusText, statusColor };
                }
                
                const note = d.note || "";
                const total = parseFloat((note.match(/T:(\d+(\.\d+)?)/) || [0, 0])[1]);
                const paid = parseFloat((note.match(/P:(\d+(\.\d+)?)/) || [0, 0])[1]);
                let duration = (note.match(/D:(3 months|6 months|1 year|none)/) || [0, 'none'])[1];
                let curr = note.includes('C:USD') ? 'usd' : (note.includes('C:YER') ? 'yer' : 'sar');
                const progress = total > 0 ? Math.min(100, (paid / total) * 100) : 0;
                let progressColor = progress >= 100 ? '#34c759' : (progress > 50 ? '#007aff' : (progress > 0 ? '#ff9500' : '#ff3b30'));
                let durationText = duration === '3 months' ? '3 أشهر' : duration === '6 months' ? '6 أشهر' : duration === '1 year' ? 'سنة' : 'غير محدد';
                const recordDate = d.updatedAt || d.createdAt;
                const formattedDate = recordDate ? new Date(recordDate).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }) : 'تاريخ غير محدد';
                return { total, paid, remaining: Math.max(0, total - paid), curr, progress, progressColor, durationText, formattedDate, status: 'active', statusText: 'نشط', statusColor: '#34c759' };
            }, []);

            const donationsTotal = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                donors.forEach(d => { const info = parseInfo(d); sums[info.curr] += info.paid; });
                return sums;
            }, [donors, parseInfo]);

            const zakatTotal = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                zakatRecords.forEach(r => { let curr = r.currency || 'yer'; sums[curr] += parseFloat(r.amount) || 0; });
                return sums;
            }, [zakatRecords]);
            
            const expensesTotal = useMemo(() => {
                const sums = { 'ريال يمني': 0, 'ريال سعودي': 0, 'دولار': 0 };
                expensesList.forEach(exp => sums[exp.currency || 'ريال يمني'] += parseFloat(exp.amount) || 0);
                return sums;
            }, [expensesList]);

            const availableBalance = useMemo(() => ({
                sar: Math.max(0, (donationsTotal.sar + zakatTotal.sar) - expensesTotal['ريال سعودي']),
                usd: Math.max(0, (donationsTotal.usd + zakatTotal.usd) - expensesTotal['دولار']),
                yer: Math.max(0, (donationsTotal.yer + zakatTotal.yer) - expensesTotal['ريال يمني'])
            }), [donationsTotal, zakatTotal, expensesTotal]);

            const filteredEmergencyList = useMemo(() => {
                let list = [...donors].sort((a, b) => (b.startDate || b.updatedAt || 0) - (a.startDate || a.updatedAt || 0));
                if (searchTerm) list = list.filter(d => d.name && d.name.includes(searchTerm));
                return list.filter(d => {
                    const info = parseInfo(d);
                    if (filter === 'paid') return info.progress >= 100;
                    if (filter === 'partial') return info.progress > 0 && info.progress < 100;
                    if (filter === 'unpaid') return info.progress === 0;
                    if (filter === 'expired') return info.status === 'expired';
                    if (filter === 'active') return info.status === 'active';
                    return true;
                });
            }, [donors, filter, searchTerm, parseInfo]);

            const filteredRequests = useMemo(() => {
                if (requestFilter === 'all') return assistanceRequests;
                return assistanceRequests.filter(r => r.status === requestFilter);
            }, [assistanceRequests, requestFilter]);

            const submitAssistanceRequest = async (e) => {
                e.preventDefault();
                if (!requestFormData.caseName || !requestFormData.requesterName || !requestFormData.caseType) {
                    alert('الرجاء تعبئة جميع الحقول المطلوبة');
                    return;
                }
                const amount = parseFloat(requestFormData.requestAmount);
                if (isNaN(amount) || amount <= 0) {
                    alert('الرجاء إدخال مبلغ صحيح');
                    return;
                }
                try {
                    const newRequestRef = rtDb.ref('assistanceRequests').push();
                    await newRequestRef.set({ 
                        ...requestFormData, 
                        requestId: newRequestRef.key, 
                        location: geoInfo.location, 
                        status: 'pending', 
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        requestAmount: amount,
                        submittedBy: currentUser?.name || 'غير محدد'
                    });
                    setSubmittedRequest({ id: newRequestRef.key, status: 'pending' });
                    setShowRequestForm(false);
                    setRequestFormData({ caseName: '', caseDetails: '', caseType: '', requesterName: '', requestDate: new Date().toISOString().split('T')[0], urgencyLevel: 'urgent', incomeReport: '', status: 'pending', requestAmount: '', preferredCurrency: 'yer' });
                } catch (error) { 
                    console.error(error);
                    alert('حدث خطأ في إرسال الطلب'); 
                }
            };

            const updateRequestStatus = async (requestId, newStatus) => {
                if (!canEdit()) return alert("⚠️ ليس لديك صلاحية لتعديل الطلبات");
                try {

uest-detail-value">{req.urgencyLevel === 'urgent' ? '🚨 مستعجل' : '✅ غير مستعجل'}</span></div><div className="request-detail-row"><span className="request-detail-label">📅 تاريخ التقديم:</span><span className="request-detail-value">{req.requestDate}</span></div><div className="request-detail-row"><span className="request-detail-label">📍 موقع التقديم:</span><span className="request-detail-value">{req.location || 'غير محدد'}</span></div></div>{req.status === 'pending' && canEdit() && (<div className="flex gap-3 mt-4 pt-3 border-t border-[#c6c6c8]/30"><button onClick={() => updateRequestStatus(req.id, 'approved')} className="flex-1 ios-button ios-button-primary py-3 rounded-xl">✅ قبول الطلب</button><button onClick={() => updateRequestStatus(req.id, 'rejected')} className="flex-1 ios-button ios-button-secondary py-3 rounded-xl text-[#ff3b30]">❌ رفض الطلب</button></div>)}</div>))}</div>

n><button type="button" onClick={() => setIsExpenseModalOpen(false)} className="w-full text-[#8e8e93] py-2">إلغاء</button></form></div></div>)}

                    {isZakatModalOpen && canEdit() && (<div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"><div className="bg-white rounded-3xl p-6 w-full max-w-md"><h2 className="font-bold text-xl mb-4">{editZakatId ? 'تعديل' : 'زكاة جديدة'}</h2><form onSubmit={handleSaveZakat} className="space-y-3"><input placeholder="الاسم" className="w-full p-3 border rounded-xl" value={zakatForm.name} onChange={e => setZakatForm({ ...zakatForm, name: e.target.value })} required /><input type="number" placeholder="المبلغ" className="w-full p-3 border rounded-xl" value={zakatForm.amount} onChange={e => setZakatForm({ ...zakatForm, amount: e.target.value })} required /><select className="w-full p-3 border rounded-xl" value={zakatForm.currency} onChange={e => setZakatForm({ ...zakatForm, currency: e.target.value })}><option value="yer">ريال يمني</option><option value="sar">ريال سعودي</option><option value="usd">دولار</option></select><div className="p-3 bg-[#e9ecef] rounded-xl text-center text-sm text-[#6c6c70]">مسجل بواسطة: {currentUser?.name} (مثبت)</div><button type="submit" className="w-full ios-button ios-button-primary py-3 rounded-xl font-medium">حفظ</button><button type="button" onClick={closeZakatModal} className="w-full text-[#8e8e93] py-2">إلغاء</button></form></div></div>)}

                    {showRequestForm && canEdit() && (<div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm overflow-y-auto"><div className="bg-white rounded-3xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto"><div className="flex justify-between mb-4"><h2 className="text-xl font-bold">تقديم طلب مساعدة</h2><button onClick={() => setShowRequestForm(false)} className="text-[#8e8e93]">✖</button></div><form onSubmit={submitAssistanceRequest} className="space-y-4"><input placeholder="اسم الحالة" className="w-full p-3 border rounded-xl" value={requestFormData.caseName} onChange={e => setRequestFormData({ ...requestFormData, caseName: e.target.value })} required /><input placeholder="اسم مقدم الحالة" className="w-full p-3 border rounded-xl" value={requestFormData.requesterName} onChange={e => setRequestFormData({ ...requestFormData, requesterName: e.target.value })} required /><select className="w-full p-3 border rounded-xl" value={requestFormData.caseType} onChange={e => setRequestFormData({ ...requestFormData, caseType: e.target.value })} required><option value="">نوع الحالة</option>{caseTypes.map(t => <option key={t.value} value={t.value}>{t.icon} {t.label}</option>)}</select><textarea rows="4" placeholder="تفاصيل الحالة" className="w-full p-3 border rounded-xl" value={requestFormData.caseDetails} onChange={e => setRequestFormData({ ...requestFormData, caseDetails: e.target.value })} required></textarea><textarea rows="3" placeholder="تقرير الدخل" className="w-full p-3 border rounded-xl" value={requestFormData.incomeReport} onChange={e => setRequestFormData({ ...requestFormData, incomeReport: e.target.value })} required></textarea><div className="grid grid-cols-2 gap-2"><input type="number" placeholder="المبلغ" className="p-3 border rounded-xl" value={requestFormData.requestAmount} onChange={e => setRequestFormData({ ...requestFormData, requestAmount: e.target.value })} /><select className="p-3 border rounded-xl" value={requestFormData.preferredCurrency} onChange={e => setRequestFormData({ ...requestFormData, preferredCurrency: e.target.value })}><option value="yer">ريال يمني</option><option value="sar">ريال سعودي</option><option value="usd">دولار</option></select></div><div className="flex gap-3"><label className="flex items-center gap-2"><input type="radio" value="urgent" checked={requestFormData.urgencyLevel === 'urgent'} onChange={e => setRequestFormData({ ...requestFormData, urgencyLevel: e.target.value })} /><span className="text-[#ff3b30]">🚨 مستعجل</span></label><label className="flex items-center gap-2"><input type="radio" value="notUrgent" checked={requestFormData.urgencyLevel === 'notUrgent'} onChange={e => setRequestFormData({ ...requestFormData, urgencyLevel: e.target.value })} /><span className="text-[#34c759]">✅ غير مستعجل</span></label></div><div className="p-3 bg-[#e9ecef] rounded-xl text-center text-sm text-[#6c6c70]">تم التقديم بواسطة: {currentUser?.name}</div><button type="submit" className="w-full ios-button ios-button-primary py-3 rounded-xl font-medium">إرسال الطلب</button></form></div></div>)}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
