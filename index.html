<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صندوق الحالات الطارئة - شامل الزكاة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-x pan-y;
            overflow-x: hidden;
        }

        .header-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .app-container {
            max-width: 480px; 
            margin: 0 auto;
            min-height: 100vh;
            background: #f8fafc;
            position: relative;
        }

        .currency-card-sar { border-top: 4px solid #10b981; background: #ecfdf5; }
        .currency-card-usd { border-top: 4px solid #3b82f6; background: #eff6ff; }
        .currency-card-yer { border-top: 4px solid #f59e0b; background: #fffbeb; }
        .currency-card-zakat { border-top: 4px solid #8b5cf6; background: #f5f3ff; }

        .timeline-track {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .timeline-fill {
            height: 100%;
            transition: width 0.5s ease-in-out;
        }

        .filter-active {
            background-color: #0f172a !important;
            color: white !important;
        }

        .update-time-badge {
            font-size: 9px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .tab-active {
            background-color: #0f172a;
            color: white;
            border-radius: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .tab-inactive {
            background-color: transparent;
            color: #475569;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBupAOs6diz9ET8lGnMdyKjS_cMS8sA2Uc",
            authDomain: "amr4admin.firebaseapp.com",
            projectId: "amr4admin",
            storageBucket: "amr4admin.firebasestorage.app",
            messagingSenderId: "177280788092",
            appId: "1:177280788092:web:44f16c8f585a5b3e484bf9"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const APP_PATH = "amr4admin";

        const App = () => {
            const [allRecords, setAllRecords] = useState([]); // جميع السجلات (طوارئ + زكاة)
            const [user, setUser] = useState(null);
            const [filter, setFilter] = useState('all'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editId, setEditId] = useState(null);
            const [isPdfLoading, setIsPdfLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [geoInfo, setGeoInfo] = useState({ ip: '...', location: 'تحديد الموقع...' });
            
            const [activeTab, setActiveTab] = useState('emergency');
            
            // نموذج الزكاة
            const [zakatForm, setZakatForm] = useState({ 
                name: '', 
                amount: '', 
                currency: 'yer', 
                recordedBy: 'مصطفى الشجاع'
            });
            const [editZakatId, setEditZakatId] = useState(null);
            const [isZakatModalOpen, setIsZakatModalOpen] = useState(false);

            const fetchGeoData = async () => {
                const providers = [
                    { url: 'https://ipapi.co/json/', map: (d) => ({ ip: d.ip, location: d.country_name }) },
                    { url: 'https://worldtimeapi.org/api/ip', map: (d) => ({ ip: d.client_ip, location: d.timezone.split('/')[0] }) },
                    { url: 'https://ipinfo.io/json?token=7656641957242c', map: (d) => ({ ip: d.ip, location: d.country }) },
                    { url: 'https://api.db-ip.com/v2/free/self', map: (d) => ({ ip: d.ipAddress, location: d.countryName }) }
                ];

                for (const provider of providers) {
                    try {
                        const controller = new AbortController();
                        const id = setTimeout(() => controller.abort(), 2500);
                        const response = await fetch(provider.url, { signal: controller.signal });
                        clearTimeout(id);
                        if (response.ok) {
                            const data = await response.json();
                            const mapped = provider.map(data);
                            if (mapped.location && mapped.location !== 'undefined' && mapped.location !== 'Unknown') {
                                setGeoInfo(mapped);
                                return;
                            }
                        }
                    } catch (e) {
                        console.warn("Provider failed, switching...");
                    }
                }

                try {
                    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    let inferredLocation = "منطقة " + tz.split('/')[0];
                    if (tz.includes("Riyadh") || tz.includes("Asia/Aden")) inferredLocation = "السعودية/اليمن";
                    setGeoInfo({ ip: 'متصل', location: inferredLocation });
                } catch(e) {
                    setGeoInfo({ ip: 'مجهول', location: 'خارج التغطية' });
                }
            };

            useEffect(() => {
                fetchGeoData();
            }, []);

            // نموذج الحالات الطارئة
            const [form, setForm] = useState({ 
                name: '', 
                recordedBy: 'مصطفى الشجاع',
                totalAmount: '', 
                paidAmount: '', 
                currency: 'sar', 
                duration: 'none', 
                isPaidStatus: false 
            });

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    if (!u) auth.signInAnonymously();
                    setUser(u);
                });
                return unsub;
            }, []);

            // جلب جميع السجلات من مجموعة donors (بما فيها الزكاة)
            useEffect(() => {
                if (!user) return;
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                return ref.onSnapshot(snap => {
                    const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setAllRecords(data);
                }, err => console.error("Firestore Error:", err));
            }, [user]);

            // فصل السجلات: طوارئ (بدون حقل type أو type != 'zakat') وزكاة (type === 'zakat')
            const donors = useMemo(() => {
                return allRecords.filter(record => record.type !== 'zakat');
            }, [allRecords]);

            const zakatRecords = useMemo(() => {
                return allRecords.filter(record => record.type === 'zakat');
            }, [allRecords]);

            const parseInfo = (d) => {
                const note = d.note || "";
                const total = parseFloat((note.match(/T:(\d+(\.\d+)?)/) || [0, 0])[1]);
                const paid = parseFloat((note.match(/P:(\d+(\.\d+)?)/) || [0, 0])[1]);
                const duration = (note.match(/D:([a-z0-9]+)/) || [0, 'none'])[1];
                let curr = 'sar';
                if (note.includes('C:USD')) curr = 'usd';
                else if (note.includes('C:YER')) curr = 'yer';
                
                const progress = total > 0 ? Math.min(100, (paid / total) * 100) : 0;
                let color = "bg-rose-500";
                if (progress >= 100) color = "bg-emerald-500";
                else if (progress > 50) color = "bg-blue-500";
                else if (progress > 0) color = "bg-amber-500";

                return { total, paid, remaining: Math.max(0, total - paid), curr, progress, color, duration };
            };

            const totals = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                donors.forEach(d => {
                    const info = parseInfo(d);
                    if (sums[info.curr] !== undefined) sums[info.curr] += info.paid;
                });
                return sums;
            }, [donors]);

            const zakatTotals = useMemo(() => {
                const sums = { sar: 0, usd: 0, yer: 0 };
                zakatRecords.forEach(record => {
                    let curr = record.currency || 'yer';
                    let amount = parseFloat(record.amount) || 0;
                    if (sums[curr] !== undefined) sums[curr] += amount;
                });
                return sums;
            }, [zakatRecords]);

            const filteredEmergencyList = useMemo(() => {
                let list = [...donors].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                if (searchTerm) list = list.filter(d => d.name.includes(searchTerm));
                return list.filter(d => {
                    const info = parseInfo(d);
                    if (filter === 'paid') return info.progress >= 100;
                    if (filter === 'partial') return info.progress > 0 && info.progress < 100;
                    if (filter === 'unpaid') return info.progress === 0;
                    return true;
                });
            }, [donors, filter, searchTerm]);

            const filteredZakatList = useMemo(() => {
                let list = [...zakatRecords].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                if (searchTerm) list = list.filter(z => z.name.includes(searchTerm));
                return list;
            }, [zakatRecords, searchTerm]);

            // حفظ الحالة الطارئة
            const handleSave = async (e) => {
                e.preventDefault();
                const now = Date.now();
                const note = `T:${form.totalAmount}|P:${form.paidAmount}|C:${form.currency.toUpperCase()}|D:${form.duration}`;
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                
                const data = { 
                    name: form.name, 
                    recordedBy: form.recordedBy,
                    ip: geoInfo.ip,
                    location: geoInfo.location,
                    note: note, 
                    updatedAt: now,
                    // لا نضيف type هنا، فالسجلات بدون type تعتبر طوارئ
                };

                try {
                    if (editId) {
                        await ref.doc(editId).update(data);
                    } else {
                        await ref.add({ ...data, createdAt: now });
                    }
                    closeModal();
                } catch (error) {
                    console.error("Firestore Save Error:", error);
                    alert("حدث خطأ في حفظ البيانات: " + error.message);
                }
            };

            // حفظ الزكاة - استخدام نفس مجموعة donors مع إضافة حقل type: "zakat"
            const handleSaveZakat = async (e) => {
                e.preventDefault();
                const now = Date.now();
                const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                
                const data = {
                    name: zakatForm.name,
                    amount: parseFloat(zakatForm.amount),
                    currency: zakatForm.currency,
                    recordedBy: zakatForm.recordedBy,
                    ip: geoInfo.ip,
                    location: geoInfo.location,
                    updatedAt: now,
                    type: 'zakat',  // علامة مميزة لسجلات الزكاة
                    createdAt: editZakatId ? (zakatRecords.find(r => r.id === editZakatId)?.createdAt || now) : now
                };
                
                console.log("جاري حفظ الزكاة:", data);
                
                try {
                    if (editZakatId) {
                        await ref.doc(editZakatId).update(data);
                        console.log("تم تحديث الزكاة بنجاح");
                    } else {
                        await ref.add(data);
                        console.log("تم إضافة الزكاة بنجاح");
                    }
                    closeZakatModal();
                } catch (error) {
                    console.error("Zakat Save Error:", error);
                    alert("حدث خطأ في حفظ الزكاة: " + error.message);
                }
            };
            
            const deleteZakatRecord = async (id) => {
                if (confirm("هل تريد حذف سجل الزكاة نهائياً؟")) {
                    const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                    await ref.doc(id).delete();
                }
            };
            
            const deleteEmergencyRecord = async (id) => {
                if (confirm("هل تريد حذف هذا السجل نهائياً؟")) {
                    const ref = db.collection('artifacts').doc(APP_PATH).collection('public').doc('data').collection('donors');
                    await ref.doc(id).delete();
                }
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditId(null);
                setForm({ name: '', recordedBy: 'مصطفى الشجاع', totalAmount: '', paidAmount: '', currency: 'sar', duration: 'none', isPaidStatus: false });
            };

            const closeZakatModal = () => {
                setIsZakatModalOpen(false);
                setEditZakatId(null);
                setZakatForm({ name: '', amount: '', currency: 'yer', recordedBy: 'مصطفى الشجاع' });
            };

            const formatUpdateDate = (ts) => {
                if (!ts) return "غير متوفر";
                return new Date(ts).toLocaleDateString('ar-YE', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            };

            const generatePDF = async () => {
                if (isPdfLoading) return;
                setIsPdfLoading(true);
                try {
                    const pdfElement = document.createElement('div');
                    pdfElement.style.position = 'fixed';
                    pdfElement.style.left = '-9999px';
                    pdfElement.style.top = '0';
                    pdfElement.style.width = '800px';
                    pdfElement.style.background = 'white';
                    pdfElement.style.direction = 'rtl';
                    pdfElement.style.padding = '40px';
                    pdfElement.style.fontFamily = 'IBM Plex Sans Arabic, sans-serif';
                    
                    let rowsHtml = '';
                    donors.forEach((d, index) => {
                        const info = parseInfo(d);
                        rowsHtml += `
                            <tr style="background: ${index % 2 === 0 ? '#ffffff' : '#f8fafc'};">
                                <td style="padding: 12px; border: 1px solid #e2e8f0; vertical-align: top;">
                                    <div style="font-weight: bold; color: #1e293b; font-size: 14px;">${d.name}</div>
                                    <div style="font-size: 10px; color: #64748b; margin-top: 2px;">الموقع: ${d.location || '---'}</div>
                                    <div style="font-size: 9px; color: #94a3b8; margin-top: 2px;">تحديث: ${formatUpdateDate(d.updatedAt)}</div>
                                </td>
                                <td style="padding: 12px; border: 1px solid #e2e8f0; text-align: center; font-weight: bold;">${info.total.toLocaleString()}</td>
                                <td style="padding: 12px; border: 1px solid #e2e8f0; text-align: center;">
                                    <div style="font-weight: bold; color: #059669;">${info.paid.toLocaleString()} <span style="font-size: 10px; color: #475569;">(${info.curr.toUpperCase()})</span></div>
                                    <div style="background: #e2e8f0; border-radius: 10px; height: 6px; width: 100%; margin-top: 6px; overflow: hidden;">
                                        <div style="background: ${info.progress >= 100 ? '#10b981' : info.progress > 50 ? '#3b82f6' : info.progress > 0 ? '#f59e0b' : '#ef4444'}; width: ${info.progress}%; height: 100%;"></div>
                                    </div>
                                    <div style="font-size: 9px; color: #94a3b8; margin-top: 4px;">نسبة الإنجاز: ${Math.round(info.progress)}%</div>
                                </td>
                                <td style="padding: 12px; border: 1px solid #e2e8f0; text-align: center; color: #475569; font-size: 12px;">${d.recordedBy || '-'}</td>
                            </tr>
                        `;
                    });
                    
                    pdfElement.innerHTML = `
                        <div style="direction: rtl; padding: 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #0f172a; padding-bottom: 25px; margin-bottom: 35px;">
                                <div>
                                    <h1 style="font-size: 32px; font-weight: bold; margin: 0; color: #0f172a;">تقرير صندوق الحالات الطارئة</h1>
                                    <p style="font-size: 18px; color: #10b981; font-weight: 700; margin: 8px 0 0;">قرية محبران - محافظة إب</p>
                                    <p style="font-size: 12px; color: #64748b; margin-top: 5px;">إشراف: مصطفى الشجاع | تطوير: عمرو مسعد الشجاع</p>
                                </div>
                                <div style="text-align: left;">
                                    <div style="background: #f1f5f9; padding: 10px 20px; border-radius: 15px; border: 1px solid #e2e8f0;">
                                        <p style="font-size: 14px; margin: 0; color: #1e293b; font-weight: bold;">تاريخ التقرير: ${new Date().toLocaleDateString('ar-YE')}</p>
                                        <p style="font-size: 14px; margin: 5px 0 0; color: #10b981; font-weight: bold;">إجمالي المشتركين: ${donors.length}</p>
                                    </div>
                                </div>
                            </div>

                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;">
                                <div style="background: #ecfdf5; padding: 15px; border-radius: 15px; border-top: 4px solid #10b981; text-align: center;">
                                    <div style="font-size: 11px; color: #065f46; font-weight: bold; margin-bottom: 5px;">إجمالي الريال السعودي</div>
                                    <div style="font-size: 18px; font-weight: 900; color: #064e3b;">${totals.sar.toLocaleString()}</div>
                                </div>
                                <div style="background: #eff6ff; padding: 15px; border-radius: 15px; border-top: 4px solid #3b82f6; text-align: center;">
                                    <div style="font-size: 11px; color: #1e40af; font-weight: bold; margin-bottom: 5px;">إجمالي الدولار</div>
                                    <div style="font-size: 18px; font-weight: 900; color: #1e3a8a;">${totals.usd.toLocaleString()}</div>
                                </div>
                                <div style="background: #fffbeb; padding: 15px; border-radius: 15px; border-top: 4px solid #f59e0b; text-align: center;">
                                    <div style="font-size: 11px; color: #92400e; font-weight: bold; margin-bottom: 5px;">إجمالي الريال اليمني</div>
                                    <div style="font-size: 18px; font-weight: 900; color: #78350f;">${totals.yer.toLocaleString()}</div>
                                </div>
                            </div>
                            
                            <table style="width: 100%; border-collapse: collapse; font-size: 13px; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0;">
                                <thead>
                                    <tr style="background: #0f172a; color: white;">
                                        <th style="padding: 15px; text-align: right; border: 1px solid #1e293b;">اسم المشترك / التفاصيل</th>
                                        <th style="padding: 15px; border: 1px solid #1e293b; text-align: center;">المقرر</th>
                                        <th style="padding: 15px; border: 1px solid #1e293b; text-align: center;">المدفوع والتقدم</th>
                                        <th style="padding: 15px; border: 1px solid #1e293b; text-align: center;">المسؤول</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                            <div style="margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 20px;">
                                <p>تم استخراج هذا التقرير من النظام الإلكتروني لصندوق الحالات الطارئة بمحبران</p>
                                <p style="margin-top: 5px;">جميع الحقوق محفوظة © ${new Date().getFullYear()}</p>
                            </div>
                        </div>
                    `;
                    
                    document.body.appendChild(pdfElement);
                    const canvas = await html2canvas(pdfElement, { scale: 2, backgroundColor: "#ffffff", logging: false });
                    const imgData = canvas.toDataURL('image/jpeg', 0.98);
                    const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const imgProps = pdf.getImageProperties(imgData);
                    const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;
                    let heightLeft = imgHeight;
                    let position = 0;
                    pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeight);
                    heightLeft -= pdf.internal.pageSize.getHeight();
                    while (heightLeft >= 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeight);
                        heightLeft -= pdf.internal.pageSize.getHeight();
                    }
                    pdf.save(`تقرير_صندوق_محبران_${new Date().toLocaleDateString('en-GB').replace(/\//g, '-')}.pdf`);
                    document.body.removeChild(pdfElement);
                } catch(e) { console.error(e); } finally { setIsPdfLoading(false); }
            };

            const currentRemaining = useMemo(() => {
                const total = parseFloat(form.totalAmount) || 0;
                const paid = parseFloat(form.paidAmount) || 0;
                return Math.max(0, total - paid);
            }, [form.totalAmount, form.paidAmount]);

            return (
                <div className="app-container shadow-2xl">
                    <header className="header-gradient text-white pt-6 pb-6 px-6 rounded-b-[2.5rem] shadow-xl">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-base font-bold text-white">صندوق الحالات الطارئة</h1>
                                <p className="text-[11px] text-emerald-400 font-medium">قرية محبران</p>
                            </div>
                            <div className="flex flex-col items-end">
                                <button onClick={generatePDF} disabled={isPdfLoading} className={`${isPdfLoading ? 'bg-slate-600 animate-pulse' : 'bg-emerald-500'} px-4 py-2 rounded-xl text-[10px] font-bold mb-3 flex items-center gap-2 transition-all shadow-lg active:scale-95`}>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>
                                    {isPdfLoading ? 'جاري التحميل...' : 'تحميل التقرير PDF'}
                                </button>
                                <div className="text-[9px] opacity-70 text-left text-white/80 leading-relaxed">
                                    <p>إشراف: مصطفى الشجاع</p>
                                    <p>تطوير : عمرو مسعد الشجاع</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="px-5 mt-8 pb-32">
                        <div className="mb-6">
                            <div className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="flex -space-x-1">
                                        <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse relative z-10"></span>
                                        <span className="h-2 w-2 rounded-full bg-emerald-500/30 animate-ping absolute"></span>
                                    </div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">موقعك الحالي:</span>
                                    <span className="text-[11px] font-black text-slate-700 bg-slate-50 px-2 py-0.5 rounded-md border border-slate-100">{geoInfo.location}</span>
                                </div>
                                <div className="text-[9px] font-mono text-slate-300">{geoInfo.ip}</div>
                            </div>
                        </div>

                        <div className="flex gap-2 bg-white p-2 rounded-3xl shadow-sm mb-8">
                            <button onClick={() => setActiveTab('emergency')} className={`flex-1 py-3 text-sm font-bold transition-all duration-200 ${activeTab === 'emergency' ? 'tab-active' : 'tab-inactive'}`}>حالات الطوارئ</button>
                            <button onClick={() => setActiveTab('zakat')} className={`flex-1 py-3 text-sm font-bold transition-all duration-200 ${activeTab === 'zakat' ? 'tab-active' : 'tab-inactive'}`}>مال الزكاة</button>
                        </div>

                        <div className="grid grid-cols-4 gap-2 mb-8">
                            <div className="currency-card-sar p-3 rounded-2xl text-center shadow-sm">
                                <p className="text-[8px] font-bold text-emerald-700 uppercase mb-1">سعودي</p>
                                <p className="text-xs font-black text-emerald-900">{activeTab === 'emergency' ? totals.sar.toLocaleString() : zakatTotals.sar.toLocaleString()}</p>
                            </div>
                            <div className="currency-card-usd p-3 rounded-2xl text-center shadow-sm">
                                <p className="text-[8px] font-bold text-blue-700 uppercase mb-1">دولار</p>
                                <p className="text-xs font-black text-blue-900">{activeTab === 'emergency' ? totals.usd.toLocaleString() : zakatTotals.usd.toLocaleString()}</p>
                            </div>
                            <div className="currency-card-yer p-3 rounded-2xl text-center shadow-sm">
                                <p className="text-[8px] font-bold text-amber-700 uppercase mb-1">يمني</p>
                                <p className="text-xs font-black text-amber-900">{activeTab === 'emergency' ? totals.yer.toLocaleString() : zakatTotals.yer.toLocaleString()}</p>
                            </div>
                            <div className="currency-card-zakat p-3 rounded-2xl text-center shadow-sm">
                                <p className="text-[8px] font-bold text-purple-700 uppercase mb-1">مبلغ الزكاة</p>
                                <p className="text-[9px] font-black text-purple-900 leading-tight">
                                    {zakatTotals.sar.toLocaleString()} ر.س<br/>
                                    {zakatTotals.usd.toLocaleString()} $<br/>
                                    {zakatTotals.yer.toLocaleString()} ي.ي
                                </p>
                            </div>
                        </div>

                        <div className="space-y-4 mb-8">
                            <input className="w-full bg-white p-4 pr-12 rounded-2xl text-sm font-bold shadow-sm outline-none ring-slate-100 focus:ring-2 transition-all" placeholder="ابحث باسم..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
                            {activeTab === 'emergency' && (
                                <div className="flex bg-white p-1.5 rounded-2xl gap-1 shadow-sm border overflow-x-auto no-scrollbar">
                                    {['all', 'paid', 'partial', 'unpaid'].map(id => (
                                        <button key={id} onClick={() => setFilter(id)} className={`flex-1 py-2.5 px-2 rounded-xl text-[10px] font-bold transition-all ${filter === id ? 'filter-active' : 'text-slate-400'}`}>
                                            {id === 'all' ? 'الكل' : id === 'paid' ? 'المكتمل' : id === 'partial' ? 'جزئي' : 'الانتظار'}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="space-y-5">
                            {activeTab === 'emergency' && filteredEmergencyList.map(d => {
                                const info = parseInfo(d);
                                return (
                                    <div key={d.id} className="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm relative group active:scale-[0.98] transition-transform">
                                        <div className="flex justify-between items-start mb-3">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <h3 className="font-bold text-slate-800 text-base">{d.name}</h3>
                                                    <span className="text-[7px] bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded uppercase font-bold">{d.location || 'غير معروف'}</span>
                                                </div>
                                                <div className="update-time-badge mb-2">تحديث: {formatUpdateDate(d.updatedAt)}</div>
                                                <div className="text-[8px] text-slate-500 bg-slate-50 px-2 py-1 rounded-lg inline-flex items-center gap-1.5 border border-slate-100 flex-wrap">
                                                    <span className="font-bold text-slate-700">بواسطة: {d.recordedBy || '---'}</span>
                                                    <span className="text-slate-300">|</span>
                                                    <span className="font-mono">{d.ip || '---'}</span>
                                                </div>
                                            </div>
                                            <div className="text-left"><div className="text-lg font-black text-slate-900">{info.paid.toLocaleString()}</div><div className="text-[10px] font-bold text-slate-300 uppercase">{info.curr}</div></div>
                                        </div>
                                        <div className="timeline-track"><div className={`timeline-fill ${info.color}`} style={{width:`${info.progress}%`}}></div></div>
                                        <div className="absolute inset-0 bg-white/95 rounded-[2.5rem] flex items-center justify-center gap-10 opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none group-hover:pointer-events-auto">
                                            <button onClick={() => { setEditId(d.id); setForm({ name: d.name, recordedBy: d.recordedBy || 'مصطفى الشجاع', totalAmount: info.total, paidAmount: info.paid, currency: info.curr, duration: info.duration, isPaidStatus: info.progress >= 100 }); setIsModalOpen(true); }} className="p-3 px-6 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">تعديل</button>
                                            <button onClick={() => deleteEmergencyRecord(d.id)} className="p-3 px-6 bg-rose-600 text-white rounded-2xl font-bold shadow-lg">حذف</button>
                                        </div>
                                    </div>
                                );
                            })}
                            
                            {activeTab === 'zakat' && filteredZakatList.map(z => (
                                <div key={z.id} className="bg-white p-6 rounded-[2.5rem] border border-purple-100 shadow-sm relative group">
                                    <div className="flex justify-between items-start">
                                        <div><h3 className="font-bold text-slate-800 text-lg">{z.name}</h3><p className="text-[9px] text-purple-500">مسجل بواسطة: {z.recordedBy}</p><p className="text-[9px] text-slate-400">{formatUpdateDate(z.updatedAt)}</p></div>
                                        <div className="text-left"><div className="text-xl font-black text-purple-800">{parseFloat(z.amount).toLocaleString()} <span className="text-xs uppercase">{z.currency === 'sar' ? 'ريال سعودي' : z.currency === 'usd' ? 'دولار' : 'ريال يمني'}</span></div></div>
                                    </div>
                                    <div className="flex gap-3 mt-4">
                                        <button onClick={() => { setEditZakatId(z.id); setZakatForm({ name: z.name, amount: z.amount, currency: z.currency, recordedBy: z.recordedBy }); setIsZakatModalOpen(true); }} className="flex-1 py-2 bg-indigo-100 text-indigo-800 rounded-xl text-xs font-bold">تعديل</button>
                                        <button onClick={() => deleteZakatRecord(z.id)} className="flex-1 py-2 bg-rose-100 text-rose-800 rounded-xl text-xs font-bold">حذف</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    <div className="fixed bottom-0 left-0 right-0 p-6 z-40 bg-gradient-to-t from-slate-100 via-slate-100/90 to-transparent pointer-events-none">
                        <div className="max-w-[480px] mx-auto pointer-events-auto">
                            <button onClick={() => activeTab === 'emergency' ? setIsModalOpen(true) : setIsZakatModalOpen(true)} className="w-full bg-slate-900 text-white py-5 rounded-[2rem] font-bold shadow-2xl active:scale-95 transition-all">
                                {activeTab === 'emergency' ? 'إضافة مشترك جديد' : 'إضافة مال زكاة جديد'}
                            </button>
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={closeModal}></div>
                            <div className="relative bg-white w-full max-w-md rounded-[3rem] p-8 overflow-y-auto max-h-[90vh] shadow-2xl">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black">{editId ? 'تعديل' : 'إضافة مشترك'}</h2><button onClick={closeModal} className="p-3 bg-slate-100 rounded-full">×</button></div>
                                <form onSubmit={handleSave} className="space-y-6">
                                    <input required placeholder="الاسم الكامل" className="w-full bg-slate-50 p-5 rounded-2xl" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} />
                                    <select className="w-full bg-slate-100 p-4 rounded-2xl" value={form.recordedBy} onChange={e=>setForm({...form, recordedBy:e.target.value})}><option>مصطفى الشجاع</option><option>ياسر الشجاع</option><option>عمرو الشجاع</option></select>
                                    <div className="grid grid-cols-2 gap-4"><input type="number" placeholder="المبلغ الكلي" className="bg-slate-50 p-5 rounded-2xl" value={form.totalAmount} onChange={e=>setForm({...form, totalAmount:e.target.value})} /><select className="bg-slate-50 p-5 rounded-2xl" value={form.currency} onChange={e=>setForm({...form, currency:e.target.value})}><option value="sar">سعودي</option><option value="usd">دولار</option><option value="yer">يمني</option></select></div>
                                    <div className="flex gap-2"><button type="button" onClick={() => setForm({...form, isPaidStatus: true, paidAmount: form.totalAmount})} className={`flex-1 py-4 rounded-2xl ${form.isPaidStatus ? 'bg-emerald-600 text-white' : 'bg-slate-50'}`}>تم السداد</button><button type="button" onClick={() => setForm({...form, isPaidStatus: false})} className={`flex-1 py-4 rounded-2xl ${!form.isPaidStatus ? 'bg-amber-500 text-white' : 'bg-slate-50'}`}>جزئي</button></div>
                                    {!form.isPaidStatus && <input type="number" placeholder="المبلغ المدفوع" className="w-full border p-5 rounded-2xl" value={form.paidAmount} onChange={e=>setForm({...form, paidAmount:e.target.value})} />}
                                    <button className="w-full bg-slate-900 text-white py-5 rounded-2xl">{editId ? 'تحديث' : 'تأكيد'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {isZakatModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onClick={closeZakatModal}></div>
                            <div className="relative bg-white w-full max-w-md rounded-[3rem] p-8 overflow-y-auto max-h-[90vh] shadow-2xl border-t-4 border-purple-500">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black text-purple-800">{editZakatId ? 'تعديل مال زكاة' : 'إضافة مال زكاة'}</h2><button onClick={closeZakatModal} className="p-3 bg-slate-100 rounded-full">×</button></div>
                                <form onSubmit={handleSaveZakat} className="space-y-6">
                                    <input required placeholder="اسم المتبرع / الجهة" className="w-full bg-slate-50 p-5 rounded-2xl" value={zakatForm.name} onChange={e=>setZakatForm({...zakatForm, name:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4"><input required type="number" placeholder="المبلغ" className="bg-slate-50 p-5 rounded-2xl" value={zakatForm.amount} onChange={e=>setZakatForm({...zakatForm, amount:e.target.value})} /><select className="bg-slate-50 p-5 rounded-2xl" value={zakatForm.currency} onChange={e=>setZakatForm({...zakatForm, currency:e.target.value})}><option value="sar">ريال سعودي</option><option value="usd">دولار</option><option value="yer">ريال يمني</option></select></div>
                                    <select className="w-full bg-slate-100 p-5 rounded-2xl" value={zakatForm.recordedBy} onChange={e=>setZakatForm({...zakatForm, recordedBy:e.target.value})}><option>مصطفى الشجاع</option><option>ياسر الشجاع</option><option>عمرو الشجاع</option></select>
                                    <button className="w-full bg-purple-700 text-white py-5 rounded-2xl font-bold">{editZakatId ? 'تحديث الزكاة' : 'إضافة الزكاة'}</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
